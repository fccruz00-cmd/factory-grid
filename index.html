<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#13241b">
  <title>Factory Grid — Desktop</title>
  <style>
    :root {
      --ink: #f3f2dc;
      --muted: #a9b9a7;
      --panel: rgba(17, 31, 25, .94);
      --panel-2: rgba(27, 48, 38, .96);
      --line: #50705a;
      --accent: #f0c75e;
      --good: #70d58d;
      --bad: #ef7c72;
      --blue: #66b6d9;
      --input: #72d4ee;
      --output: #ffe073;
      --shadow: rgba(4, 10, 7, .55);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d1812;
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      touch-action: none;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: linear-gradient(#294637, #1b3328);
      box-shadow: 0 4px 0 #0b1711, inset 0 1px rgba(255,255,255,.08);
      cursor: pointer;
      touch-action: none;
    }

    button:active,
    button.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0b1711, inset 0 1px rgba(255,255,255,.05);
      filter: brightness(1.13);
    }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: .48;
      filter: grayscale(.7);
      cursor: default;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      touch-action: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .logo,
    .pill,
    #objective,
    #selectionInfo {
      border: 1px solid rgba(123, 163, 133, .7);
      background: var(--panel);
      box-shadow: 0 4px 12px var(--shadow), inset 0 1px rgba(255,255,255,.05);
    }

    .logo {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .7px;
      white-space: nowrap;
    }

    .logo small {
      color: var(--accent);
      font-size: 9px;
      display: block;
      margin-top: 2px;
      letter-spacing: .4px;
    }

    #statPills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .pill {
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 11px;
      white-space: nowrap;
    }

    .pill strong { color: var(--accent); }
    .pill.rate strong { color: var(--good); }

    .top-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      display: grid;
      place-content: center;
      border-radius: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .icon-glyph {
      display: block;
      font-size: 17px;
      line-height: 17px;
    }

    .icon-label {
      display: block;
      margin-top: 3px;
      color: #c5d5c7;
      font-size: 6px;
      letter-spacing: .4px;
    }

    #buildModeBtn.active {
      border-color: var(--accent);
      background: linear-gradient(#35512d, #182d20);
      color: #fff0a8;
      box-shadow: 0 4px 0 #0a140d, 0 0 0 2px rgba(240, 204, 101, .16);
    }

    #buildModeBtn.active .icon-label { color: #fff0a8; }

    .tech-badge {
      position: absolute;
      right: -5px;
      top: -6px;
      min-width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      border: 1px solid #dff9ff;
      border-radius: 999px;
      background: #31839b;
      color: white;
      font-size: 8px;
      line-height: 1;
      box-shadow: 0 2px 5px rgba(0,0,0,.45);
    }

    #sidePanel {
      position: absolute;
      right: calc(10px + env(safe-area-inset-right));
      top: calc(58px + env(safe-area-inset-top));
      width: min(310px, 43vw);
      display: grid;
      gap: 7px;
    }

    #objective,
    #selectionInfo {
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 10px;
      line-height: 1.35;
    }

    #objective b,
    #selectionInfo b {
      color: var(--accent);
      display: block;
      margin-bottom: 3px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    #selectionInfo[hidden] { display: none; }

    #defenseHud {
      position: fixed;
      z-index: 14;
      top: calc(62px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    #defenseBtn {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      overflow: hidden;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(28, 49, 39, .97), rgba(12, 26, 19, .97));
      box-shadow: 0 5px 14px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.06);
    }

    #defenseBtn .defense-chip {
      min-width: 82px;
      display: grid;
      gap: 2px;
      padding: 6px 10px;
      border-right: 1px solid rgba(101, 137, 111, .45);
      color: #aebfb1;
      font-size: 7px;
      line-height: 1;
      text-align: center;
      letter-spacing: .55px;
    }

    #defenseBtn .defense-chip:last-child { border-right: 0; }
    #defenseBtn strong { color: #f4e8a9; font-size: 9px; letter-spacing: 0; }
    #defenseBtn .hub strong { color: var(--good); }
    #defenseBtn .ammo strong { color: #f0c56c; }
    #defenseBtn.active-wave {
      border-color: #ec756d;
      background: linear-gradient(180deg, rgba(87, 37, 34, .98), rgba(42, 20, 18, .98));
      animation: defensePulse 1.1s ease-in-out infinite alternate;
    }

    #defenseBtn.base-critical .hub strong { color: #ff8c83; }

    @keyframes defensePulse {
      from { box-shadow: 0 5px 14px rgba(0,0,0,.42), 0 0 0 rgba(239,124,114,0); }
      to { box-shadow: 0 5px 14px rgba(0,0,0,.42), 0 0 15px rgba(239,124,114,.28); }
    }

    #controlDeck,
    #buildDock,
    #lowerControls {
      display: contents;
    }

    #buildBar {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(550px, calc(100vw - 350px));
      min-width: 300px;
      padding: 7px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 7px 20px var(--shadow);
      pointer-events: auto;
      touch-action: pan-x;
    }

    #buildBar::-webkit-scrollbar { display: none; }

    .tool-page-btn {
      position: fixed;
      z-index: 22;
      display: none;
      width: 44px;
      height: 94px;
      padding: 4px 2px;
      border-radius: 12px;
      font-weight: 900;
      pointer-events: auto;
    }

    .tool-page-btn span {
      display: block;
      font-size: 19px;
      line-height: 28px;
    }

    .tool-page-btn small {
      display: block;
      font-size: 7px;
      line-height: 1;
      letter-spacing: -.2px;
    }

    .tool {
      position: relative;
      flex: 0 0 94px;
      min-height: 84px;
      border-radius: 9px;
      padding: 7px 5px 5px;
      text-align: center;
    }

    .tool.selected {
      border-color: var(--accent);
      background: linear-gradient(#5b5130, #393a25);
      box-shadow: 0 4px 0 #17180d, 0 0 0 2px rgba(240,199,94,.24);
    }

    .tool .tool-icon {
      display: block;
      font-size: 22px;
      font-weight: 900;
      line-height: 25px;
    }

    .tool .tool-name {
      display: block;
      font-size: 9px;
      line-height: 1.1;
      min-height: 20px;
    }

    .tool .tool-cost {
      display: block;
      color: var(--accent);
      font-size: 9px;
      margin-top: 3px;
    }

    .tool .tool-recipe {
      display: block;
      min-height: 18px;
      color: var(--input);
      font-size: 7px;
      line-height: 1.15;
      margin-top: 2px;
    }

    .tool .lock {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      border-radius: 8px;
      background: rgba(7, 13, 10, .78);
      font-size: 10px;
      color: #d2d4c5;
    }

    .tool.locked .lock { display: grid; }

    #buildToggleBtn {
      display: none;
    }

    #dpad {
      position: fixed;
      z-index: 21;
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(10px + env(safe-area-inset-bottom));
      width: 148px;
      height: 148px;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      gap: 4px;
      pointer-events: auto;
    }

    .dkey {
      border-radius: 12px;
      font-size: 22px;
      font-weight: 900;
      padding: 0;
    }

    .dkey.up { grid-area: 1 / 2; }
    .dkey.left { grid-area: 2 / 1; }
    .dkey.center {
      grid-area: 2 / 2;
      pointer-events: none;
      opacity: .8;
      background: #14271e;
      box-shadow: inset 0 0 0 5px #213a2e;
    }
    .dkey.right { grid-area: 2 / 3; }
    .dkey.down { grid-area: 3 / 2; }

    #actions {
      position: fixed;
      z-index: 21;
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(10px + env(safe-area-inset-bottom));
      width: 148px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      pointer-events: auto;
    }

    .action-btn {
      min-height: 62px;
      border-radius: 14px;
      padding: 5px;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.2;
    }

    .action-btn .big {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    #upgradeBtn,
    #cancelBtn { grid-column: 1 / -1; min-height: 43px; }

    #invertBtn {
      display: none;
      border-color: #d6b968;
      color: #fff0b0;
    }

    body.can-invert #invertBtn { display: block; }
    body.has-selection.can-invert #upgradeBtn { grid-column: auto; }
    body.has-selection.can-invert #cancelBtn { grid-column: 1 / -1; }

    #recipeBtn {
      display: none;
      border-color: #7cb7d8;
      color: #dff5ff;
    }

    body.can-select-recipe #recipeBtn { display: block; }
    body.has-selection.can-select-recipe #upgradeBtn { grid-column: auto; }
    body.has-selection.can-select-recipe #cancelBtn { grid-column: 1 / -1; }

    #upgradeBtn {
      border-color: #6dcde7;
      color: #d9f8ff;
    }

    #modeHint {
      position: fixed;
      z-index: 18;
      left: 50%;
      bottom: calc(108px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: min(560px, 70vw);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(10, 20, 15, .86);
      border: 1px solid rgba(116, 151, 123, .7);
      color: #d7dfd2;
      font-size: 9px;
      text-align: center;
      pointer-events: none;
    }

    #toast {
      position: fixed;
      z-index: 150;
      top: calc(92px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -10px);
      max-width: min(420px, 84vw);
      padding: 9px 13px;
      border: 1px solid var(--accent);
      border-radius: 9px;
      background: rgba(22, 34, 27, .97);
      color: var(--ink);
      box-shadow: 0 7px 22px rgba(0,0,0,.42);
      font-size: 11px;
      opacity: 0;
      transition: opacity .16s, transform .16s;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #modalOverlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4, 10, 7, .74);
      backdrop-filter: blur(3px);
      pointer-events: auto;
    }

    #modalOverlay[hidden] { display: none; }

    .modal-card {
      width: min(520px, 94vw);
      max-height: min(680px, 90vh);
      overflow: auto;
      border: 2px solid #6d8c72;
      border-radius: 14px;
      background: linear-gradient(180deg, #213b2e, #13251c);
      box-shadow: 0 18px 50px rgba(0,0,0,.58), inset 0 1px rgba(255,255,255,.08);
      padding: 17px;
      touch-action: pan-y;
    }

    #modalTitle {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 18px;
      line-height: 1.15;
    }

    #modalBody {
      color: #d7dfd2;
      font-size: 11px;
      line-height: 1.55;
    }

    #modalBody p { margin: 8px 0; }
    #modalBody ul, #modalBody ol { margin: 8px 0; padding-left: 20px; }
    #modalBody li { margin: 5px 0; }
    #modalBody strong { color: #fff1b4; }
    #modalBody .good { color: var(--good); }
    #modalBody .bad { color: var(--bad); }
    #modalBody .box {
      margin: 9px 0;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #466451;
      background: rgba(8, 18, 13, .42);
    }

    #modalActions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-action {
      min-width: 108px;
      min-height: 44px;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 900;
    }

    .modal-action.primary { border-color: var(--accent); color: #fff2b7; }
    .modal-action.danger { border-color: var(--bad); color: #ffd3cf; }

    .recipe-machine-summary {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding: 11px;
      border: 1px solid #557565;
      border-radius: 10px;
      background: rgba(7, 18, 13, .52);
    }

    .recipe-machine-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid #779787;
      border-radius: 10px;
      background: #1b3026;
      color: #fff0ae;
      font-size: 24px;
    }

    .recipe-machine-summary p { margin: 0; color: #b9cbbd; }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .recipe-card {
      min-height: 138px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 6px;
      padding: 11px;
      border: 1px solid #526d5d;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(36, 58, 46, .96), rgba(17, 35, 26, .96));
      color: #dce7dd;
      text-align: left;
    }

    .recipe-card.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px rgba(240, 204, 101, .15);
    }

    .recipe-card.locked { opacity: .52; }
    .recipe-card strong { color: #fff1b4; font-size: 12px; }
    .recipe-card small { color: #9fbaa7; font-size: 8px; }

    .recipe-flow {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d5e1d7;
      font-size: 9px;
    }

    .recipe-flow span {
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(6, 15, 10, .5);
      border: 1px solid #40594a;
    }

    .recipe-select {
      min-height: 34px;
      border-radius: 7px;
      border-color: #6f9279;
      color: #e7f0e8;
      font-size: 9px;
      font-weight: 900;
    }

    .recipe-card.active .recipe-select { border-color: var(--accent); color: #fff1ae; }

    @media (max-width: 560px) {
      .recipe-grid { grid-template-columns: 1fr; }
    }

    .tech-summary {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tech-points,
    .tech-source {
      min-width: 0;
      padding: 9px 11px;
      border-radius: 9px;
    }

    .tech-points {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #55b7d2;
      background: linear-gradient(180deg, rgba(20, 70, 82, .98), rgba(10, 42, 51, .98));
      color: #d9f8ff;
      font-size: 13px;
      text-align: center;
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }

    .tech-points strong { font-size: 18px; color: #fff8c7; }

    .tech-source {
      flex: 1;
      border: 1px solid #466451;
      background: rgba(8, 18, 13, .48);
      color: #b9cbbd;
      font-size: 9px;
      line-height: 1.45;
    }

    .tech-workbench {
      height: min(590px, 66vh);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 252px;
      gap: 10px;
      min-height: 430px;
    }

    .tech-viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      border: 1px solid #436153;
      border-radius: 10px;
      background: #0c1812;
      box-shadow: inset 0 0 28px rgba(0,0,0,.55);
      scrollbar-color: #557565 #12231a;
      scrollbar-width: thin;
      touch-action: pan-x pan-y;
      overscroll-behavior: contain;
      cursor: grab;
    }

    .tech-viewport.dragging { cursor: grabbing; }

    .tech-map {
      position: relative;
      width: 2100px;
      height: 1240px;
      overflow: hidden;
      background-color: #0f1d16;
      background-image:
        linear-gradient(rgba(99, 137, 113, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 137, 113, .08) 1px, transparent 1px),
        linear-gradient(rgba(99, 137, 113, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 137, 113, .025) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    }

    .tech-map::after {
      content: "ARRASTE PARA EXPLORAR";
      position: absolute;
      right: 18px;
      bottom: 13px;
      color: rgba(187, 211, 193, .35);
      font-size: 8px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .tech-lane {
      position: absolute;
      left: 22px;
      right: 22px;
      border: 1px solid rgba(82, 122, 97, .2);
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(28, 63, 43, .3), rgba(13, 29, 21, .05));
      pointer-events: none;
    }

    .tech-lane span {
      position: absolute;
      left: 14px;
      top: 10px;
      color: rgba(172, 205, 181, .35);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.4px;
    }

    .tech-lane.extraction { top: 20px; height: 135px; }
    .tech-lane.processing { top: 190px; height: 145px; background-color: rgba(91, 63, 27, .12); }
    .tech-lane.assembly { top: 350px; height: 260px; background-color: rgba(42, 74, 82, .12); }
    .tech-lane.logistics { top: 620px; height: 135px; background-color: rgba(32, 74, 91, .12); }
    .tech-lane.automation { top: 770px; height: 280px; background-color: rgba(79, 48, 90, .11); }
    .tech-lane.core { top: 1060px; height: 140px; background-color: rgba(112, 87, 29, .13); }

    .tech-links {
      position: absolute;
      inset: 0;
      width: 2100px;
      height: 1240px;
      overflow: visible;
      pointer-events: none;
    }

    .tech-link-shadow,
    .tech-link {
      fill: none;
      stroke-linecap: round;
    }

    .tech-link-shadow { stroke: rgba(0,0,0,.65); stroke-width: 11; }
    .tech-link { stroke: #3c5547; stroke-width: 5; }
    .tech-link.available { stroke: #d8af46; filter: drop-shadow(0 0 4px rgba(240,199,94,.45)); }
    .tech-link.unlocked { stroke: #60cf80; filter: drop-shadow(0 0 4px rgba(96,207,128,.42)); }

    .tech-map-node {
      position: absolute;
      left: var(--node-x);
      top: var(--node-y);
      width: 178px;
      min-height: 92px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 9px;
      border: 2px solid #4a6657;
      border-radius: 11px;
      background: linear-gradient(145deg, #263d31, #15261d);
      color: #dce7db;
      text-align: left;
      box-shadow: 0 5px 0 #07100b, 0 8px 16px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.07);
    }

    .tech-map-node.blocked { opacity: .58; filter: saturate(.45); }

    .tech-map-node.available {
      border-color: #e2bc54;
      background: linear-gradient(145deg, #4c4527, #272a1b);
      box-shadow: 0 5px 0 #161307, 0 0 18px rgba(240,199,94,.2), inset 0 1px rgba(255,255,255,.09);

          const pondB = ((x - 41) ** 2) / 12 + ((y - 9) ** 2) / 18 < 1;
          if (border || pondA || pondB) {
            terrain[y][x] = 2; // água
            continue;
          }
          if (x === HUB.x || y === HUB.y) {
            terrain[y][x] = 1; // caminho
            continue;
          }
          if (!nearFactoryZone(x, y) && !deposits.has(posKey(x, y))) {
            const h = hash2(x, y);
            if (h < 0.036) terrain[y][x] = 3; // árvore
            else if (h > 0.975) terrain[y][x] = 4; // pedra
          }
        }
      }
      terrain[HUB.y][HUB.x] = 1;
    }

    generateTerrain();

    function inBounds(x, y) {
      return x >= 0 && y >= 0 && x < WORLD_W && y < WORLD_H;
    }

    function getDeposit(x, y) {
      return deposits.get(posKey(x, y)) || null;
    }

    function isHub(x, y) {
      return x === HUB.x && y === HUB.y;
    }

    function isEnemySpawn(x, y) {
      return ENEMY_SPAWNS.some(spawn => spawn.x === x && spawn.y === y);
    }

    const BUILDING_BASE_HP = Object.freeze({
      belt: 90,
      splitter: 150,
      underground: 140,
      merger: 150,
      miner: 200,
      furnace: 240,
      assembler: 260,
      wall: 600,
      turret: 280
    });

    function maxBuildingHp(type, level = 1, techState = null) {
      const safeLevel = clamp(Math.floor(Number(level) || 1), 1, MAX_BUILDING_LEVEL);
      const localScale = type === "wall" ? 1 + (safeLevel - 1) * 0.45 : 1 + (safeLevel - 1) * 0.22;
      let technology = 1;
      const tech = techState || (typeof state !== "undefined" && state ? state.tech : {}) || {};
      if (type === "wall" && tech.fortification1) technology *= 1.50;
      if (type === "wall" && tech.fortification2) technology *= 1.75;
      return Math.round((BUILDING_BASE_HP[type] || 180) * localScale * technology);
    }

    // ---------------------------------------------------------------------
    // Estado serializável e índices transitórios
    // ---------------------------------------------------------------------
    function createNewState() {
      return {
        version: SAVE_VERSION,
        seed: 1337,
        lastSavedAt: Date.now(),
        nextId: 1,
        player: {
          x: HUB.x,
          y: HUB.y - 2,
          tx: HUB.x,
          ty: HUB.y - 2,
          moving: false,
          moveProgress: 0,
          dir: 2
        },
        economy: {
          credits: STARTING_CREDITS,
          runEarned: 0,
          lifetimeEarned: 0,
          tier: 1,
          prestige: 0,
          researchPoints: 0
        },
        tech: {},
        inventory: EMPTY_INVENTORY(),
        buildings: [],
        items: [],
        enemies: [],
        combat: {
          wave: 1,
          phase: "locked",
          timer: 0,
          baseHp: HUB_MAX_HP,
          spawnRemaining: 0,
          spawnCooldown: 0,
          spawnedThisWave: 0,
          kills: 0,
          victories: 0,
          defeats: 0
        },
        stats: {
          delivered: EMPTY_INVENTORY(),
          onlineSeconds: 0,
          offlineSeconds: 0,
          totalBuilt: 0
        },
        ui: {
          seenHelp: false
        }
      };
    }

    function sanitizeState(raw) {
      const base = createNewState();
      if (!raw || typeof raw !== "object") return base;

      const safe = {
        ...base,
        ...raw,
        version: SAVE_VERSION,
        player: { ...base.player, ...(raw.player || {}) },
        economy: { ...base.economy, ...(raw.economy || {}) },
        tech: { ...base.tech, ...(raw.tech || {}) },
        inventory: { ...base.inventory, ...(raw.inventory || {}) },
        combat: { ...base.combat, ...(raw.combat || {}) },
        stats: {
          ...base.stats,
          ...(raw.stats || {}),
          delivered: { ...base.stats.delivered, ...((raw.stats && raw.stats.delivered) || {}) }
        },
        ui: { ...base.ui, ...(raw.ui || {}) }
      };

      safe.player.x = clamp(Math.round(Number(safe.player.x) || base.player.x), 2, WORLD_W - 3);
      safe.player.y = clamp(Math.round(Number(safe.player.y) || base.player.y), 2, WORLD_H - 3);
      safe.player.tx = safe.player.x;
      safe.player.ty = safe.player.y;
      safe.player.moving = false;
      safe.player.moveProgress = 0;
      safe.player.dir = clamp(Math.round(Number(safe.player.dir) || 0), 0, 3);

      for (const key of Object.keys(ITEMS)) {
        safe.inventory[key] = Math.max(0, Number(safe.inventory[key]) || 0);
        safe.stats.delivered[key] = Math.max(0, Number(safe.stats.delivered[key]) || 0);
      }

      safe.economy.credits = Math.max(0, Number(safe.economy.credits) || 0);
      safe.economy.runEarned = Math.max(0, Number(safe.economy.runEarned) || 0);
      safe.economy.lifetimeEarned = Math.max(0, Number(safe.economy.lifetimeEarned) || 0);
      safe.economy.prestige = Math.max(0, Math.floor(Number(safe.economy.prestige) || 0));
      safe.economy.tier = clamp(Math.floor(Number(safe.economy.tier) || 1), 1, 3);
      const hadResearchPoints = raw.economy && Number.isFinite(Number(raw.economy.researchPoints));
      safe.economy.researchPoints = Math.max(0, Number(safe.economy.researchPoints) || 0);
      if (!hadResearchPoints) {
        safe.economy.researchPoints = Object.keys(ITEMS).reduce((total, kind) => {
          return total + safe.inventory[kind] * ITEMS[kind].research;
        }, 0);
      }
      safe.tech = Object.fromEntries(Object.keys(TECHS).map(key => [key, Boolean(safe.tech[key])]));
      safe.lastSavedAt = Number(safe.lastSavedAt) || Date.now();
      safe.nextId = Math.max(1, Math.floor(Number(safe.nextId) || 1));

      const validTypes = new Set(["miner", "belt", "crafter", "furnace", "assembler", "splitter", "underground", "merger", "wall", "turret"]);
      safe.buildings = Array.isArray(raw.buildings) ? raw.buildings.filter(b => {
        return b && validTypes.has(b.type) && inBounds(Number(b.x), Number(b.y)) && !isHub(Number(b.x), Number(b.y));
      }).map(b => {
        const legacyCrafter = b.type === "crafter";
        const migratedType = legacyCrafter
          ? (b.recipe === "copperWire" ? "assembler" : "furnace")
          : b.type;
        let recipe = b.recipe;
        if (!RECIPES[recipe] || RECIPES[recipe].machine !== migratedType) {
          if (migratedType === "furnace") recipe = "ironPlate";
          else if (migratedType === "assembler") recipe = b.type === "assembler" ? "circuit" : "copperWire";
          else recipe = null;
        }
        const buffer = { ...(b.buffer || {}) };
        if (legacyCrafter && migratedType === "assembler" && recipe === "copperWire" && buffer.copperOre) {
          buffer.copperPlate = (Number(buffer.copperPlate) || 0) + (Number(buffer.copperOre) || 0);
          delete buffer.copperOre;
        }
        const level = clamp(Math.floor(Number(b.level) || 1), 1, MAX_BUILDING_LEVEL);
        const maximumHp = maxBuildingHp(migratedType, level, safe.tech);
        return {
          id: String(b.id || `b${safe.nextId++}`),
          type: migratedType,
          recipe,
          x: Math.round(Number(b.x)),
          y: Math.round(Number(b.y)),
          dir: clamp(Math.round(Number(b.dir) || 0), 0, 3),
          level,
          hp: clamp(Number.isFinite(Number(b.hp)) ? Number(b.hp) : maximumHp, 0, maximumHp),
          cooldown: Math.max(0, Number(b.cooldown) || 0),
          progress: Math.max(0, Number(b.progress) || 0),
          buffer,
          outputCount: Math.max(0, Math.floor(Number(b.outputCount) || 0)),
          role: migratedType === "underground" && b.role === "exit" ? "exit" : migratedType === "underground" ? "entrance" : null,
          pairId: migratedType === "underground" && b.pairId != null ? String(b.pairId) : null,
          splitToggle: Math.abs(Math.floor(Number(b.splitToggle) || 0)) % 2,
          mirrored: (migratedType === "splitter" || migratedType === "merger") ? Boolean(b.mirrored) : false,
          aimAngle: Number(b.aimAngle) || 0,
          shotFlash: 0,
          targetId: null,
          shotX: Number(b.shotX) || Math.round(Number(b.x)),
          shotY: Number(b.shotY) || Math.round(Number(b.y))
        };
      }) : [];

      const occupied = new Set();
      safe.buildings = safe.buildings.filter(b => {
        const key = posKey(b.x, b.y);
        if (occupied.has(key)) return false;
        occupied.add(key);
        return true;
      });

      const sanitizedById = new Map(safe.buildings.map(building => [building.id, building]));
      for (const building of safe.buildings) {
        if (building.type !== "underground") continue;
        const pair = sanitizedById.get(building.pairId);
        if (!pair || pair.type !== "underground" || pair.id === building.id || pair.pairId !== building.id || pair.role === building.role) {
          building.pairId = null;
        }
      }

      safe.items = Array.isArray(raw.items) ? raw.items.filter(item => {
        return item && ITEMS[item.kind] && inBounds(Number(item.x), Number(item.y));
      }).map(item => ({
        id: String(item.id || `i${safe.nextId++}`),
        kind: item.kind,
        x: Math.round(Number(item.x)),
        y: Math.round(Number(item.y)),
        progress: clamp(Number(item.progress) || 0, 0, 0.999)
      })) : [];

      const hadCombat = raw.combat && typeof raw.combat === "object";
      safe.combat.wave = Math.max(1, Math.floor(Number(safe.combat.wave) || 1));
      safe.combat.phase = ["locked", "prep", "active"].includes(safe.combat.phase) ? safe.combat.phase : "locked";
      safe.combat.timer = Math.max(0, Number(safe.combat.timer) || 0);
      safe.combat.baseHp = clamp(Number(safe.combat.baseHp) || HUB_MAX_HP, 0, HUB_MAX_HP);
      safe.combat.spawnRemaining = Math.max(0, Math.floor(Number(safe.combat.spawnRemaining) || 0));
      safe.combat.spawnCooldown = Math.max(0, Number(safe.combat.spawnCooldown) || 0);
      safe.combat.spawnedThisWave = Math.max(0, Math.floor(Number(safe.combat.spawnedThisWave) || 0));
      safe.combat.kills = Math.max(0, Math.floor(Number(safe.combat.kills) || 0));
      safe.combat.victories = Math.max(0, Math.floor(Number(safe.combat.victories) || 0));
      safe.combat.defeats = Math.max(0, Math.floor(Number(safe.combat.defeats) || 0));
      if (!hadCombat && safe.economy.tier >= 2) {
        safe.combat.phase = "prep";
        safe.combat.timer = FIRST_WAVE_PREP;
        safe.inventory.ammo += 8;
      }

      safe.enemies = Array.isArray(raw.enemies) ? raw.enemies.filter(enemy => {
        return enemy && inBounds(Number(enemy.x), Number(enemy.y));
      }).map(enemy => {
        const kind = ["raider", "runner", "tank"].includes(enemy.kind) ? enemy.kind : "raider";
        const maximumHp = Math.max(1, Number(enemy.maxHp) || 40);
        return {
          id: String(enemy.id || `e${safe.nextId++}`),
          kind,
          x: clamp(Math.round(Number(enemy.x) || HUB.x), 0, WORLD_W - 1),
          y: clamp(Math.round(Number(enemy.y) || HUB.y), 0, WORLD_H - 1),
          tx: Number.isFinite(Number(enemy.tx)) ? clamp(Math.round(Number(enemy.tx)), 0, WORLD_W - 1) : null,
          ty: Number.isFinite(Number(enemy.ty)) ? clamp(Math.round(Number(enemy.ty)), 0, WORLD_H - 1) : null,
          progress: clamp(Number(enemy.progress) || 0, 0, 0.999),
          hp: clamp(Number(enemy.hp) || maximumHp, 0, maximumHp),
          maxHp: maximumHp,
          speed: clamp(Number(enemy.speed) || 1, 0.25, 4),
          damage: Math.max(1, Number(enemy.damage) || 6),
          attackCooldown: Math.max(0, Number(enemy.attackCooldown) || 0)
        };
      }) : [];
      if (safe.combat.phase !== "active") safe.enemies = [];

      return safe;
    }

    let state;
    let isNewGame = false;
    let buildingByPos = new Map();
    let buildingById = new Map();
    let itemByPos = new Map();

    function rebuildBuildingIndexes() {
      buildingByPos = new Map();
      buildingById = new Map();
      for (const building of state.buildings) {
        buildingByPos.set(posKey(building.x, building.y), building);
        buildingById.set(building.id, building);
      }
    }

    function rebuildItemIndex() {
      itemByPos = new Map();
      for (const item of state.items) itemByPos.set(posKey(item.x, item.y), item);
    }

    function buildingAt(x, y) {
      return buildingByPos.get(posKey(x, y)) || null;
    }

    function itemAt(x, y) {
      return itemByPos.get(posKey(x, y)) || null;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) {
          isNewGame = true;
          return createNewState();
        }
        return sanitizeState(JSON.parse(raw));
      } catch (error) {
        console.warn("Save inválido; iniciando novo jogo.", error);
        isNewGame = true;
        return createNewState();
      }
    }

    // ---------------------------------------------------------------------
    // Simulação autoritativa
    // ---------------------------------------------------------------------
    let simClock = 0;
    let heldMoveDir = null;
    let currentTool = null;
    let buildDir = 1;
    let buildMirrored = false;
    let pendingUnderground = null;
    let selectedBuildingId = null;
    let hoverTile = null;
    let lastPaintTile = null;
    let paintedThisGesture = new Set();
    let pointerPainting = false;
    let defenseFlow = null;
    let defenseFlowDirty = true;

    function hasTech(key) {
      return Boolean(state.tech && state.tech[key]);
    }

    function prestigeSpeedPerLevel() {
      if (hasTech("prestige2")) return 0.30;
      if (hasTech("prestige1")) return 0.25;
      return 0.20;
    }

    function researchMultiplier() {
      let multiplier = 1;
      if (hasTech("research1")) multiplier += 0.25;
      if (hasTech("research2")) multiplier += 0.50;
      if (hasTech("research3")) multiplier += 1.00;
      return multiplier;
    }

    function itemCreditValue(kind) {
      const item = ITEMS[kind];
      if (!item) return 0;
      let multiplier = 1;
      const processed = kind === "ironPlate" || kind === "copperPlate" || kind === "copperWire" || kind === "circuit" || kind === "ammo";
      if (processed && hasTech("market1")) multiplier *= 1.20;
      if (hasTech("market2")) multiplier *= 1.35;
      return item.value * multiplier;
    }

    function upgradeCostMultiplier() {
      let multiplier = 1;
      if (hasTech("engineering1")) multiplier *= 0.80;
      if (hasTech("engineering2")) multiplier *= 0.70;
      return multiplier;
    }

    function machineMultiplier() {
      const prestige = 1 + state.economy.prestige * prestigeSpeedPerLevel();
      let centralControl = 1;
      if (hasTech("core1")) centralControl *= 1.10;
      if (hasTech("core2")) centralControl *= 1.15;
      if (hasTech("core3")) centralControl *= 1.25;
      return prestige * centralControl;
    }

    function buildingSpeedMultiplier(building) {
      const level = 1 + (Math.max(1, Number(building.level) || 1) - 1) * LEVEL_SPEED_BONUS;
      let technology = 1;
      if (building.type === "miner") {
        if (hasTech("mining1")) technology *= 1.25;
        if (hasTech("mining2")) technology *= 1.30;
        if (hasTech("mining3")) technology *= 1.40;
        if (hasTech("mining4")) technology *= 1.60;
      }
      if (isTransportBuilding(building)) {
        if (hasTech("logistics1")) technology *= 1.25;
        if (hasTech("logistics2")) technology *= 1.30;
        if (hasTech("logistics3")) technology *= 1.40;
        if (hasTech("logistics4")) technology *= 1.60;
      }
      if (building.type === "furnace") {
        if (hasTech("processing1")) technology *= 1.25;
        if (hasTech("processing2")) technology *= 1.35;
        if (hasTech("processing3")) technology *= 1.55;
      }
      if (building.type === "assembler") {
        if (hasTech("assembly1")) technology *= 1.25;
        if (hasTech("assembly2")) technology *= 1.50;
        if (hasTech("assembly3")) technology *= 1.75;
      }
      return machineMultiplier() * level * technology;
    }

    function inputBufferCapacity() {
      if (hasTech("buffering2")) return 120;
      return hasTech("buffering1") ? 40 : 20;
    }

    function outputBufferCapacity() {
      if (hasTech("buffering2")) return 30;
      return hasTech("buffering1") ? 10 : 5;
    }

    function offlineMaxSeconds() {
      if (hasTech("offline3")) return BASE_OFFLINE_MAX_SECONDS * 7;
      if (hasTech("offline2")) return BASE_OFFLINE_MAX_SECONDS * 4;
      return hasTech("offline1") ? BASE_OFFLINE_MAX_SECONDS * 2 : BASE_OFFLINE_MAX_SECONDS;
    }

    function computeTier() {
      if (state.economy.runEarned >= TIER_THRESHOLDS[3]) return 3;
      if (state.economy.runEarned >= TIER_THRESHOLDS[2]) return 2;
      return 1;
    }

    function updateTier(silent = false) {
      const newTier = computeTier();
      if (newTier > state.economy.tier) {
        state.economy.tier = newTier;
        if (!silent) {
          const message = newTier === 2
            ? "Tier 2 liberado: Fornalha, Montadora e logística avançada."
            : "Tier 3 liberado: receita de Circuito na Montadora.";
          showToast(message);
        }
      }
      unlockCombatIfNeeded(silent);
    }

    function isWalkable(x, y) {
      if (!inBounds(x, y) || isHub(x, y)) return false;
      const tile = terrain[y][x];
      if (tile === 2 || tile === 3 || tile === 4) return false;
      const building = buildingAt(x, y);
      return !building || isTransportBuilding(building);
    }

    function attemptMove(dirIndex) {
      const player = state.player;
      const dir = DIRS[dirIndex];
      player.dir = dirIndex;
      if (player.moving) return false;
      const nx = player.x + dir.x;
      const ny = player.y + dir.y;
      if (!isWalkable(nx, ny)) return false;
      player.tx = nx;
      player.ty = ny;
      player.moveProgress = 0;
      player.moving = true;
      return true;
    }

    function updatePlayer(dt) {
      const player = state.player;
      if (player.moving) {
        player.moveProgress += dt / 0.14;
        if (player.moveProgress >= 1) {
          player.x = player.tx;
          player.y = player.ty;
          player.moveProgress = 0;
          player.moving = false;
        }
      }
      if (!player.moving && heldMoveDir !== null) attemptMove(heldMoveDir);
    }

    function isTransportBuilding(building) {
      return Boolean(building && (building.type === "belt" || building.type === "splitter" || building.type === "underground" || building.type === "merger"));
    }

    function undergroundPair(building) {
      if (!building || building.type !== "underground" || !building.pairId) return null;
      const pair = buildingById.get(String(building.pairId));
      if (!pair || pair.type !== "underground" || pair.pairId !== building.id || pair.role === building.role) return null;
      return pair;
    }

    function undergroundDistance(building) {
      const pair = undergroundPair(building);
      return pair ? Math.max(1, Math.abs(pair.x - building.x) + Math.abs(pair.y - building.y)) : 1;
    }

    function canInvertTransport(building) {
      return Boolean(building && (building.type === "splitter" || building.type === "merger"));
    }

    function splitterSide(building) {
      return (building.dir + (building.mirrored ? 3 : 1)) % 4;
    }

    function mergerInputSides(building) {
      return [(building.dir + 2) % 4, (building.dir + (building.mirrored ? 1 : 3)) % 4];
    }

    function modifierAuxiliarySide(building) {
      return building.type === "splitter" ? splitterSide(building) : mergerInputSides(building)[1];
    }

    function transportAcceptsFrom(building, sourceX, sourceY) {
      if (!isTransportBuilding(building)) return false;
      if (building.type === "belt") return true;
      const sourceSide = inputSideFromSource(building, sourceX, sourceY);
      if (sourceSide === null) return false;
      if (building.type === "splitter") return sourceSide === (building.dir + 2) % 4;
      if (building.type === "merger") {
        return mergerInputSides(building).includes(sourceSide);
      }
      return building.role === "entrance" && sourceSide === (building.dir + 2) % 4 && Boolean(undergroundPair(building));
    }

    function transportOutputDirections(building) {
      if (!building) return [];
      if (building.type === "splitter") {
        const forward = building.dir;
        const side = splitterSide(building);
        return building.splitToggle ? [side, forward] : [forward, side];
      }
      if (building.type === "belt" || building.type === "merger" || (building.type === "underground" && building.role === "exit")) {
        return [building.dir];
      }
      return [];
    }

    function transportCapacity(building) {
      if (!isTransportBuilding(building)) return Infinity;
      const base = BELT_SPEED * buildingSpeedMultiplier(building);
      return building.type === "underground" && building.role === "entrance"
        ? base / undergroundDistance(building)
        : base;
    }

    function machineAccepts(building, kind) {
      if (!building || (building.type !== "furnace" && building.type !== "assembler")) return false;
      const recipe = RECIPES[building.recipe];
      return Boolean(recipe && recipe.inputs[kind]);
    }

    function isConfigurableMachine(building) {
      return Boolean(building && (building.type === "furnace" || building.type === "assembler"));
    }

    function inputSideFromSource(building, sourceX, sourceY) {
      if (!Number.isFinite(sourceX) || !Number.isFinite(sourceY)) return null;
      const dx = sourceX - building.x;
      const dy = sourceY - building.y;
      if (Math.abs(dx) + Math.abs(dy) !== 1) return null;
      return DIRS.findIndex(dir => dir.x === dx && dir.y === dy);
    }

    function machineAcceptsFrom(building, kind, sourceX, sourceY) {
      if (!machineAccepts(building, kind)) return false;
      const sourceSide = inputSideFromSource(building, sourceX, sourceY);
      return sourceSide === null || sourceSide !== building.dir;
    }

    function acceptInput(building, kind, sourceX = null, sourceY = null) {
      if (!machineAcceptsFrom(building, kind, sourceX, sourceY)) return false;
      const current = Math.max(0, Number(building.buffer[kind]) || 0);
      if (current >= inputBufferCapacity()) return false;
      building.buffer[kind] = current + 1;
      return true;
    }

    function deliverItem(kind, quantity = 1) {
      const amount = Math.max(0, quantity);
      if (!ITEMS[kind] || amount <= 0) return;
      const earned = itemCreditValue(kind) * amount;
      state.inventory[kind] += amount;
      state.stats.delivered[kind] += amount;
      state.economy.credits += earned;
      state.economy.runEarned += earned;
      state.economy.lifetimeEarned += earned;
      state.economy.researchPoints += ITEMS[kind].research * amount * researchMultiplier();
    }

    function tryEmit(building, kind) {
      const dir = DIRS[building.dir];
      const tx = building.x + dir.x;
      const ty = building.y + dir.y;
      if (!inBounds(tx, ty)) return false;

      if (isHub(tx, ty)) {
        deliverItem(kind);
        return true;
      }

      const target = buildingAt(tx, ty);
      if (!target) return false;

      if (isTransportBuilding(target) && transportAcceptsFrom(target, building.x, building.y)) {
        if (itemAt(tx, ty)) return false;
        const item = {
          id: `i${state.nextId++}`,
          kind,
          x: tx,
          y: ty,
          progress: 0
        };
        state.items.push(item);
        itemByPos.set(posKey(tx, ty), item);
        return true;
      }

      return acceptInput(target, kind, building.x, building.y);
    }

    function hasRecipeInputs(building, recipe) {
      for (const [kind, count] of Object.entries(recipe.inputs)) {
        if ((Number(building.buffer[kind]) || 0) < count) return false;
      }
      return true;
    }

    function consumeRecipeInputs(building, recipe) {
      for (const [kind, count] of Object.entries(recipe.inputs)) {
        building.buffer[kind] = Math.max(0, (Number(building.buffer[kind]) || 0) - count);
      }
    }

    function updateMachines(dt) {
      for (const building of state.buildings) {
        if (isTransportBuilding(building)) continue;
        const multiplier = buildingSpeedMultiplier(building);

        if (building.type === "miner") {
          const depositKind = getDeposit(building.x, building.y);
          if (!depositKind) continue;
          building.cooldown = Math.min(MINER_INTERVAL, building.cooldown + dt * multiplier);
          if (building.cooldown >= MINER_INTERVAL && tryEmit(building, depositKind)) {
            building.cooldown -= MINER_INTERVAL;
          }
          continue;
        }

        const recipe = RECIPES[building.recipe];
        if (!recipe) continue;

        if (building.outputCount > 0 && tryEmit(building, recipe.output)) {
          building.outputCount -= 1;
        }

        if (building.outputCount >= outputBufferCapacity() || !hasRecipeInputs(building, recipe)) continue;
        building.progress += dt * multiplier;
        if (building.progress >= recipe.duration) {
          building.progress -= recipe.duration;
          consumeRecipeInputs(building, recipe);
          building.outputCount += Math.max(1, Math.floor(Number(recipe.outputAmount) || 1));
        }
      }
    }

    function moveTransportItem(item, transport, direction, dead) {
      const dir = DIRS[direction];
      const nx = item.x + dir.x;
      const ny = item.y + dir.y;
      if (!inBounds(nx, ny)) return false;

      if (isHub(nx, ny)) {
        deliverItem(item.kind);
        dead.add(item.id);
        itemByPos.delete(posKey(item.x, item.y));
        return true;
      }

      const target = buildingAt(nx, ny);
      if (isTransportBuilding(target) && transportAcceptsFrom(target, item.x, item.y)) {
        if (itemAt(nx, ny)) return false;
        itemByPos.delete(posKey(item.x, item.y));
        item.x = nx;
        item.y = ny;
        item.progress = Math.max(0, item.progress - 1);
        itemByPos.set(posKey(nx, ny), item);
        return true;
      }

      if (target && acceptInput(target, item.kind, item.x, item.y)) {
        dead.add(item.id);
        itemByPos.delete(posKey(item.x, item.y));
        return true;
      }
      return false;
    }

    function updateBelts(dt) {
      const dead = new Set();

      for (const item of state.items) {
        const transport = buildingAt(item.x, item.y);
        if (!isTransportBuilding(transport)) {
          dead.add(item.id);
          itemByPos.delete(posKey(item.x, item.y));
          continue;
        }

        const tunnelFactor = transport.type === "underground" && transport.role === "entrance"
          ? undergroundDistance(transport)
          : 1;
        item.progress += dt * BELT_SPEED * buildingSpeedMultiplier(transport) / tunnelFactor;
        if (item.progress < 1) continue;

        if (transport.type === "underground" && transport.role === "entrance") {
          const exit = undergroundPair(transport);
          if (!exit || itemAt(exit.x, exit.y)) {
            item.progress = 0.999;
            continue;
          }
          itemByPos.delete(posKey(item.x, item.y));
          item.x = exit.x;
          item.y = exit.y;
          item.progress = 0;
          itemByPos.set(posKey(exit.x, exit.y), item);
          continue;
        }

        let moved = false;
        for (const direction of transportOutputDirections(transport)) {
          if (moveTransportItem(item, transport, direction, dead)) {
            moved = true;
            if (transport.type === "splitter") transport.splitToggle = transport.splitToggle ? 0 : 1;
            break;
          }
        }
        if (!moved) item.progress = 0.999;
      }

      if (dead.size) state.items = state.items.filter(item => !dead.has(item.id));
    }

    // -------------------------------------------------------------------
    // Defesa: fluxo de invasão, torretas e waves
    // -------------------------------------------------------------------
    function markDefenseFlowDirty() {
      defenseFlowDirty = true;
      defenseFlow = null;
    }

    function defenseTerrainPassable(x, y) {
      if (!inBounds(x, y)) return false;
      if (isHub(x, y)) return true;
      const tile = terrain[y][x];
      return tile !== 2 && tile !== 3 && tile !== 4;
    }

    function defenseTileCost(x, y) {
      if (isHub(x, y)) return 1;
      const building = buildingAt(x, y);
      if (!building) return 1;
      if (building.type === "wall") return 17;
      if (building.type === "turret") return 12;
      if (isTransportBuilding(building)) return 7;
      return 22;
    }

    function rebuildDefenseFlow() {
      const size = WORLD_W * WORLD_H;
      const distances = new Float64Array(size);
      distances.fill(Infinity);
      const heap = [];
      const indexOf = (x, y) => y * WORLD_W + x;

      const push = node => {
        heap.push(node);
        let index = heap.length - 1;
        while (index > 0) {
          const parent = Math.floor((index - 1) / 2);
          if (heap[parent].distance <= node.distance) break;
          heap[index] = heap[parent];
          index = parent;
        }
        heap[index] = node;
      };

      const pop = () => {
        if (!heap.length) return null;
        const root = heap[0];
        const tail = heap.pop();
        if (heap.length && tail) {
          let index = 0;
          while (true) {
            const left = index * 2 + 1;
            const right = left + 1;
            if (left >= heap.length) break;
            const child = right < heap.length && heap[right].distance < heap[left].distance ? right : left;
            if (heap[child].distance >= tail.distance) break;
            heap[index] = heap[child];
            index = child;
          }
          heap[index] = tail;
        }
        return root;
      };

      distances[indexOf(HUB.x, HUB.y)] = 0;
      push({ x: HUB.x, y: HUB.y, distance: 0 });
      while (heap.length) {
        const current = pop();
        if (!current || current.distance !== distances[indexOf(current.x, current.y)]) continue;
        const enterCurrentCost = defenseTileCost(current.x, current.y);
        for (const dir of DIRS) {
          const nx = current.x + dir.x;
          const ny = current.y + dir.y;
          if (!defenseTerrainPassable(nx, ny)) continue;
          const nextDistance = current.distance + enterCurrentCost;
          const nextIndex = indexOf(nx, ny);
          if (nextDistance + 1e-9 >= distances[nextIndex]) continue;
          distances[nextIndex] = nextDistance;
          push({ x: nx, y: ny, distance: nextDistance });
        }
      }
      defenseFlow = distances;
      defenseFlowDirty = false;
    }

    function defenseDistanceAt(x, y) {
      if (defenseFlowDirty || !defenseFlow) rebuildDefenseFlow();
      return defenseFlow[y * WORLD_W + x];
    }

    function nextEnemyTile(enemy) {
      let best = null;
      let bestScore = Infinity;
      for (let index = 0; index < DIRS.length; index++) {
        const dir = DIRS[index];
        const x = enemy.x + dir.x;
        const y = enemy.y + dir.y;
        if (!defenseTerrainPassable(x, y)) continue;
        const distance = defenseDistanceAt(x, y);
        const score = distance + defenseTileCost(x, y) + index * 0.0001;
        if (score < bestScore) {
          bestScore = score;
          best = { x, y };
        }
      }
      return best;
    }

    function enemyVisualPosition(enemy) {
      if (enemy.tx == null || enemy.ty == null) return { x: enemy.x, y: enemy.y };
      const progress = smoothStep(enemy.progress);
      return {
        x: enemy.x + (enemy.tx - enemy.x) * progress,
        y: enemy.y + (enemy.ty - enemy.y) * progress
      };
    }

    function turretRange(building) {
      return 4 + Math.min(1.8, (Math.max(1, building.level || 1) - 1) * 0.2) + (hasTech("ballistics1") ? 1 : 0);
    }

    function turretDamage(building) {
      let damage = 22 * (1 + (Math.max(1, building.level || 1) - 1) * 0.35) * machineMultiplier();
      if (hasTech("ballistics1")) damage *= 1.30;
      return damage;
    }

    function turretFireInterval(building) {
      let speed = 1 + (Math.max(1, building.level || 1) - 1) * 0.14;
      if (hasTech("ballistics2")) speed *= 1.50;
      return 0.9 / speed;
    }

    function turretAmmoCost() {
      return hasTech("ballistics2") ? 0.70 : 1;
    }

    function damageEnemy(enemy, damage) {
      if (!enemy || enemy.hp <= 0) return false;
      enemy.hp -= Math.max(0, damage);
      if (enemy.hp > 0) return false;
      enemy.hp = 0;
      state.combat.kills += 1;
      return true;
    }

    function updateTurrets(dt) {
      for (const turret of state.buildings.filter(building => building.type === "turret")) {
        turret.cooldown = Math.max(0, (Number(turret.cooldown) || 0) - dt);
        turret.shotFlash = Math.max(0, (Number(turret.shotFlash) || 0) - dt);
        if (turret.cooldown > 0 || state.inventory.ammo + 1e-9 < turretAmmoCost()) continue;

        const range = turretRange(turret);
        let target = null;
        let targetDistance = Infinity;
        for (const enemy of state.enemies) {
          if (enemy.hp <= 0) continue;
          const position = enemyVisualPosition(enemy);
          const distance = Math.hypot(position.x - turret.x, position.y - turret.y);
          if (distance <= range && distance < targetDistance) {
            target = enemy;
            targetDistance = distance;
          }
        }
        if (!target) continue;

        const position = enemyVisualPosition(target);
        turret.aimAngle = Math.atan2(position.y - turret.y, position.x - turret.x);
        turret.shotX = position.x;
        turret.shotY = position.y;
        turret.shotFlash = 0.13;
        turret.targetId = target.id;
        turret.cooldown = turretFireInterval(turret);
        state.inventory.ammo = Math.max(0, state.inventory.ammo - turretAmmoCost());
        damageEnemy(target, turretDamage(turret));
      }
    }

    function waveEnemyCount(wave) {
      return Math.min(38, 5 + wave * 2);
    }

    function spawnWaveEnemy() {
      const wave = state.combat.wave;
      const index = state.combat.spawnedThisWave;
      const spawn = ENEMY_SPAWNS[(wave + index) % ENEMY_SPAWNS.length];
      const sequence = index + 1;
      const kind = sequence % 7 === 0 ? "tank" : sequence % 4 === 0 ? "runner" : "raider";
      const scale = Math.pow(1.16, wave - 1);
      const kindHp = kind === "tank" ? 2.8 : kind === "runner" ? 0.68 : 1;
      const kindSpeed = kind === "tank" ? 0.68 : kind === "runner" ? 1.55 : 1;
      const kindDamage = kind === "tank" ? 1.9 : kind === "runner" ? 0.72 : 1;
      const maximumHp = Math.round(46 * scale * kindHp);
      state.enemies.push({
        id: `e${state.nextId++}`,
        kind,
        x: spawn.x,
        y: spawn.y,
        tx: null,
        ty: null,
        progress: 0,
        hp: maximumHp,
        maxHp: maximumHp,
        speed: 1.05 * kindSpeed * Math.min(1.45, 1 + wave * 0.012),
        damage: 8 * Math.pow(1.11, wave - 1) * kindDamage,
        attackCooldown: 0
      });
      state.combat.spawnedThisWave += 1;
      state.combat.spawnRemaining = Math.max(0, state.combat.spawnRemaining - 1);
    }

    function repairBetweenWaves(dt) {
      state.combat.baseHp = Math.min(HUB_MAX_HP, state.combat.baseHp + dt * 6);
      const repairRate = hasTech("fortification2") ? 0.025 : 0.006;
      for (const wall of state.buildings.filter(building => building.type === "wall")) {
        const maximum = maxBuildingHp("wall", wall.level);
        wall.hp = Math.min(maximum, wall.hp + maximum * repairRate * dt);
      }
    }

    function unlockCombatIfNeeded(silent = false) {
      if (!state || state.economy.tier < 2 || state.combat.phase !== "locked") return;
      state.combat.phase = "prep";
      state.combat.timer = FIRST_WAVE_PREP;
      state.combat.baseHp = HUB_MAX_HP;
      state.inventory.ammo += 8;
      if (!silent) showToast("Defesa liberada: 75 s até a primeira wave. Você recebeu 8 munições de emergência.");
    }

    function startWave(manual = false) {
      if (state.combat.phase !== "prep") return false;
      state.combat.phase = "active";
      state.combat.timer = 0;
      state.combat.spawnRemaining = waveEnemyCount(state.combat.wave);
      state.combat.spawnedThisWave = 0;
      state.combat.spawnCooldown = 0;
      state.enemies = [];
      showToast(`Wave ${state.combat.wave} iniciada: ${state.combat.spawnRemaining} inimigos entrando pelas estradas.`);
      updateUI(true);
      return true;
    }

    function finishWave() {
      const completedWave = state.combat.wave;
      const credits = 35 + completedWave * 15;
      const research = 3 + completedWave * 0.75;
      state.economy.credits += credits;
      state.economy.runEarned += credits;
      state.economy.lifetimeEarned += credits;
      state.economy.researchPoints += research;
      state.combat.victories += 1;
      state.combat.wave += 1;
      state.combat.phase = "prep";
      state.combat.timer = Math.max(20, BETWEEN_WAVE_PREP - completedWave * 0.7);
      state.combat.baseHp = Math.min(HUB_MAX_HP, state.combat.baseHp + HUB_MAX_HP * 0.25);
      showToast(`Wave ${completedWave} vencida: +${credits} Cr e +${formatNumber(research)} Pesquisa.`);
      cachedNetwork = null;
      updateTier(false);
    }

    function failWave() {
      const lostCredits = Math.floor(state.economy.credits * 0.10);
      state.economy.credits = Math.max(0, state.economy.credits - lostCredits);
      state.combat.defeats += 1;
      state.combat.phase = "prep";
      state.combat.timer = 60;
      state.combat.baseHp = HUB_MAX_HP;
      state.combat.spawnRemaining = 0;
      state.enemies = [];
      showToast(`Hub destruído. Wave ${state.combat.wave} reinicia em 60 s; perda de ${lostCredits} Cr.`);
      updateUI(true);
    }

    function updateEnemies(dt) {
      for (const enemy of state.enemies) {
        if (enemy.hp <= 0) continue;
        enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);

        if (enemy.tx != null && enemy.ty != null) {
          enemy.progress += dt * enemy.speed;
          if (enemy.progress >= 1) {
            enemy.x = enemy.tx;
            enemy.y = enemy.ty;
            enemy.tx = null;
            enemy.ty = null;
            enemy.progress = 0;
          }
          continue;
        }

        const next = nextEnemyTile(enemy);
        if (!next) continue;
        if (isHub(next.x, next.y)) {
          if (enemy.attackCooldown <= 0) {
            state.combat.baseHp = Math.max(0, state.combat.baseHp - enemy.damage);
            enemy.attackCooldown = ENEMY_ATTACK_INTERVAL;
            if (state.combat.baseHp <= 0) {
              failWave();
              return;
            }
          }
          continue;
        }

        const blocker = buildingAt(next.x, next.y);
        if (blocker) {
          if (enemy.attackCooldown <= 0) {
            blocker.hp = Math.max(0, (Number(blocker.hp) || maxBuildingHp(blocker.type, blocker.level)) - enemy.damage);
            enemy.attackCooldown = ENEMY_ATTACK_INTERVAL;
            if (blocker.hp <= 0) destroyBuildingByCombat(blocker);
          }
          continue;
        }

        enemy.tx = next.x;
        enemy.ty = next.y;
        enemy.progress = 0;
      }
      state.enemies = state.enemies.filter(enemy => enemy.hp > 0);
    }

    function updateCombat(dt) {
      unlockCombatIfNeeded(false);
      if (state.combat.phase === "locked") return;
      if (state.combat.phase === "prep") {
        repairBetweenWaves(dt);
        state.combat.timer = Math.max(0, state.combat.timer - dt);
        if (state.combat.timer <= 0) startWave(false);
        return;
      }

      state.combat.spawnCooldown -= dt;
      if (state.combat.spawnRemaining > 0 && state.combat.spawnCooldown <= 0) {
        spawnWaveEnemy();
        state.combat.spawnCooldown = Math.max(0.38, 1.15 - state.combat.wave * 0.025);
      }
      updateTurrets(dt);
      updateEnemies(dt);
      if (state.combat.phase === "active" && state.combat.spawnRemaining === 0 && state.enemies.length === 0) finishWave();
    }

    function suspendCombatForOffline() {
      if (!state || state.combat.phase !== "active") return false;
      state.enemies = [];
      state.combat.phase = "prep";
      state.combat.timer = Math.max(25, state.combat.timer || 0);
      state.combat.spawnRemaining = 0;
      state.combat.spawnCooldown = 0;
      return true;
    }

    function simulateStep(dt) {
      simClock += dt;
      state.stats.onlineSeconds += dt;
      rebuildItemIndex();
      updatePlayer(dt);
      updateMachines(dt);
      updateBelts(dt);
      updateTier(false);
      updateCombat(dt);
    }

    // ---------------------------------------------------------------------
    // Construção, edição e progressão
    // ---------------------------------------------------------------------
    function playerOccupies(x, y) {
      const player = state.player;
      return (player.x === x && player.y === y) || (player.moving && player.tx === x && player.ty === y);
    }

    function enemyOccupies(x, y) {
      return state.enemies.some(enemy => enemy.hp > 0 && (
        (enemy.x === x && enemy.y === y) || (enemy.tx === x && enemy.ty === y)
      ));
    }

    function placementProblem(toolKey, x, y) {
      const tool = TOOLS[toolKey];
      if (!tool) return "Ferramenta inválida.";
      if (state.economy.tier < tool.tier) return `Requer Tier ${tool.tier}.`;
      if (!inBounds(x, y)) return "Fora do mapa.";
      if (isHub(x, y)) return "O Hub ocupa este tile.";
      if (isEnemySpawn(x, y)) return "Esta estrada é uma entrada de inimigos.";
      if (buildingAt(x, y)) return "Tile já ocupado.";
      if (playerOccupies(x, y)) return "O personagem está neste tile.";
      if (enemyOccupies(x, y)) return "Um inimigo está ocupando este tile.";
      const tile = terrain[y][x];
      if (tile === 2) return "Não é possível construir na água.";
      if (tile === 3 || tile === 4) return "Há um obstáculo neste tile.";
      const deposit = getDeposit(x, y);
      if (tool.type === "miner" && !deposit) return "Mineradores precisam ficar sobre uma jazida.";
      if (tool.type !== "miner" && deposit) return "Reserve a jazida para um minerador.";
      if (state.economy.credits < tool.cost) return `Faltam ${formatNumber(tool.cost - state.economy.credits)} Cr.`;
      return null;
    }

    function placeToolAt(toolKey, x, y, direction = buildDir, quiet = false) {
      const problem = placementProblem(toolKey, x, y);
      if (problem) {
        if (!quiet) showToast(problem);
        return null;
      }

      const tool = TOOLS[toolKey];
      if (tool.type === "underground") return null;
      const building = {
        id: `b${state.nextId++}`,
        type: tool.type,
        recipe: tool.recipe || null,
        x,
        y,
        dir: direction,
        level: 1,
        hp: maxBuildingHp(tool.type, 1),
        cooldown: 0,
        progress: 0,
        buffer: {},
        outputCount: 0,
        role: null,
        pairId: null,
        splitToggle: 0,
        mirrored: canInvertTransport({ type: tool.type }) ? buildMirrored : false,
        aimAngle: 0,
        shotFlash: 0,
        targetId: null,
        shotX: x,
        shotY: y
      };
      state.economy.credits -= tool.cost;
      state.buildings.push(building);
      state.stats.totalBuilt += 1;
      buildingByPos.set(posKey(x, y), building);
      buildingById.set(building.id, building);
      selectedBuildingId = building.id;
      cachedNetwork = null;
      markDefenseFlowDirty();
      if (!quiet && tool.type !== "belt") showToast(`${tool.label} construído.`);
      updateUI(true);
      if (!quiet && isConfigurableMachine(building)) {
        window.setTimeout(() => showMachineRecipes(building.id), 0);
      }
      return building;
    }

    function placeUndergroundEndpoint(x, y) {
      if (!pendingUnderground) {
        const problem = placementProblem("underground", x, y);
        if (problem) {
          showToast(problem);
          return null;
        }
        pendingUnderground = { x, y, dir: buildDir };
        selectedBuildingId = null;
        showToast(`Entrada IN marcada. Coloque a saída OUT de 2 a 6 tiles em ${DIRS[buildDir].label}.`);
        updateUI(true);
        return null;
      }

      const entry = pendingUnderground;
      const dir = DIRS[entry.dir];
      const dx = x - entry.x;
      const dy = y - entry.y;
      const distance = dx * dir.x + dy * dir.y;
      const perpendicular = dx * dir.y - dy * dir.x;
      if (perpendicular !== 0 || distance < 2 || distance > 6) {
        showToast(`A saída OUT deve ficar reta, de 2 a 6 tiles em ${DIRS[entry.dir].label}.`);
        return null;
      }

      const entryProblem = placementProblem("underground", entry.x, entry.y);
      if (entryProblem) {
        pendingUnderground = null;
        showToast(`A entrada deixou de ser válida: ${entryProblem}`);
        updateUI(true);
        return null;
      }
      const exitProblem = placementProblem("underground", x, y);
      if (exitProblem) {
        showToast(exitProblem);
        return null;
      }

      const entranceId = `b${state.nextId++}`;
      const exitId = `b${state.nextId++}`;
      const base = {
        type: "underground",
        recipe: null,
        dir: entry.dir,
        level: 1,
        hp: maxBuildingHp("underground", 1),
        cooldown: 0,
        progress: 0,
        buffer: {},
        outputCount: 0,
        splitToggle: 0,
        mirrored: false
      };
      const entrance = { ...base, buffer: {}, id: entranceId, x: entry.x, y: entry.y, role: "entrance", pairId: exitId };
      const exit = { ...base, buffer: {}, id: exitId, x, y, role: "exit", pairId: entranceId };
      state.economy.credits -= TOOLS.underground.cost;
      state.buildings.push(entrance, exit);
      state.stats.totalBuilt += 2;
      buildingByPos.set(posKey(entrance.x, entrance.y), entrance);
      buildingByPos.set(posKey(exit.x, exit.y), exit);
      buildingById.set(entrance.id, entrance);
      buildingById.set(exit.id, exit);
      selectedBuildingId = exit.id;
      pendingUnderground = null;
      cachedNetwork = null;
      markDefenseFlowDirty();
      showToast(`Túnel conectado: IN → ${distance} tiles subterrâneos → OUT.`);
      updateUI(true);
      return exit;
    }

    function toolKeyForBuilding(building) {
      if (!building) return null;
      if (building.type === "miner") return "miner";
      if (building.type === "belt") return "belt";
      if (building.type === "splitter") return "splitter";
      if (building.type === "underground") return "underground";
      if (building.type === "merger") return "merger";
      if (building.type === "furnace") return "furnace";
      if (building.type === "assembler") return "assembler";
      if (building.type === "wall") return "wall";
      if (building.type === "turret") return "turret";
      return null;
    }

    function upgradeCost(building) {
      if (!building || building.level >= MAX_BUILDING_LEVEL) return 0;
      const base = UPGRADE_BASE_COST[building.type] || 50;
      return Math.ceil(base * Math.pow(1.65, building.level - 1) * upgradeCostMultiplier());
    }

    function upgradeSelectedBuilding() {
      const building = buildingById.get(selectedBuildingId);
      if (!building) {
        showToast("Selecione uma construção para melhorar.");
        return;
      }
      if (building.level >= MAX_BUILDING_LEVEL) {
        showToast("Esta construção já está no nível máximo.");
        return;
      }
      const cost = upgradeCost(building);
      if (state.economy.credits < cost) {
        showToast(`Faltam ${formatNumber(cost - state.economy.credits)} Cr para o upgrade.`);
        return;
      }
      state.economy.credits -= cost;
      const previousMaximumHp = maxBuildingHp(building.type, building.level);
      building.level += 1;
      const nextMaximumHp = maxBuildingHp(building.type, building.level);
      building.hp = Math.min(nextMaximumHp, Math.max(0, Number(building.hp) || 0) + (nextMaximumHp - previousMaximumHp));
      if (building.type === "underground") {
        const pair = undergroundPair(building);
        if (pair) {
          const pairPreviousMaximum = maxBuildingHp(pair.type, pair.level);
          pair.level = building.level;
          const pairNextMaximum = maxBuildingHp(pair.type, pair.level);
          pair.hp = Math.min(pairNextMaximum, Math.max(0, Number(pair.hp) || 0) + (pairNextMaximum - pairPreviousMaximum));
        }
      }
      cachedNetwork = null;
      markDefenseFlowDirty();
      const upgradeEffect = building.type === "wall"
        ? `${building.hp.toFixed(0)}/${nextMaximumHp} HP`
        : building.type === "turret"
          ? `${formatNumber(turretDamage(building))} dano • alcance ${formatNumber(turretRange(building))}`
          : `+${(building.level - 1) * 20}% local`;
      showToast(`${buildingLabel(building)} agora é nível ${building.level}: ${upgradeEffect}.`);
      updateUI(true);
    }

    function techPrerequisitesMet(key) {
      const tech = TECHS[key];
      return Boolean(tech && tech.requires.every(requirement => hasTech(requirement)));
    }

    function buyTech(key) {
      const tech = TECHS[key];
      if (!tech || hasTech(key)) return;
      if (!techPrerequisitesMet(key)) {
        showToast("Pesquise primeiro os pré-requisitos desta tecnologia.");
        return;
      }
      if (state.economy.researchPoints + 1e-9 < tech.cost) {
        showToast(`Faltam ${formatNumber(tech.cost - state.economy.researchPoints)} pontos de Pesquisa.`);
        return;
      }
      const wallHealthRatios = (key === "fortification1" || key === "fortification2")
        ? new Map(state.buildings.filter(building => building.type === "wall").map(wall => {
            const maximum = maxBuildingHp("wall", wall.level);
            return [wall.id, maximum > 0 ? clamp(wall.hp / maximum, 0, 1) : 1];
          }))
        : null;
      state.economy.researchPoints -= tech.cost;
      state.tech[key] = true;
      if (wallHealthRatios) {
        for (const wall of state.buildings.filter(building => building.type === "wall")) {
          wall.hp = maxBuildingHp("wall", wall.level) * (wallHealthRatios.get(wall.id) ?? 1);
        }
      }
      cachedNetwork = null;
      markDefenseFlowDirty();
      updateUI(true);
      saveGame(false);
      showToast(`${tech.label} pesquisada.`);
      showTechTree();
    }

    function destroyBuildingByCombat(building) {
      if (!building || !buildingById.has(building.id)) return false;
      const pair = building.type === "underground" ? undergroundPair(building) : null;
      const removedIds = new Set([building.id, ...(pair ? [pair.id] : [])]);
      const removedTiles = new Set([posKey(building.x, building.y), ...(pair ? [posKey(pair.x, pair.y)] : [])]);
      state.buildings = state.buildings.filter(entry => !removedIds.has(entry.id));
      state.items = state.items.filter(item => !removedTiles.has(posKey(item.x, item.y)));
      if (selectedBuildingId && removedIds.has(selectedBuildingId)) selectedBuildingId = null;
      rebuildBuildingIndexes();
      rebuildItemIndex();
      cachedNetwork = null;
      markDefenseFlowDirty();
      showToast(`${buildingLabel(building)} foi destruída pelos inimigos.`);
      return true;
    }

    function removeSelectedBuilding() {
      const building = buildingById.get(selectedBuildingId);
      if (!building) {
        showToast("Selecione uma máquina ou esteira primeiro.");
        return;
      }
      const toolKey = toolKeyForBuilding(building);
      const refund = toolKey ? Math.floor(TOOLS[toolKey].cost * 0.7) : 0;
      const pair = building.type === "underground" ? undergroundPair(building) : null;
      const removedIds = new Set([building.id, ...(pair ? [pair.id] : [])]);
      const removedTiles = new Set([posKey(building.x, building.y), ...(pair ? [posKey(pair.x, pair.y)] : [])]);
      state.buildings = state.buildings.filter(entry => !removedIds.has(entry.id));
      state.items = state.items.filter(item => !removedTiles.has(posKey(item.x, item.y)));
      state.economy.credits += refund;
      selectedBuildingId = null;
      rebuildBuildingIndexes();
      rebuildItemIndex();
      cachedNetwork = null;
      markDefenseFlowDirty();
      showToast(`${pair ? "Par subterrâneo removido" : "Removido"}. Reembolso: ${refund} Cr.`);
      updateUI(true);
    }

    function removeBuildingAtTile(x, y) {
      const target = buildingAt(x, y);
      if (!target) {
        showToast("Nenhuma construção sob o cursor.");
        return false;
      }
      selectedBuildingId = target.id;
      removeSelectedBuilding();
      return true;
    }

    function rotateCurrentTarget() {
      if (currentTool) {
        if (TOOLS[currentTool].type === "wall" || TOOLS[currentTool].type === "turret") {
          showToast(`${TOOLS[currentTool].label} não precisa de direção.`);
          return;
        }
        buildDir = (buildDir + 1) % 4;
        if (pendingUnderground) pendingUnderground.dir = buildDir;
        showToast(`Saída de construção: ${DIRS[buildDir].label}.`);
      } else {
        const building = buildingById.get(selectedBuildingId);
        if (!building) {
          showToast("Escolha uma peça ou selecione uma construção.");
          return;
        }
        if (building.type === "wall" || building.type === "turret") {
          showToast(`${buildingLabel(building)} não precisa ser girada.`);
          return;
        }
        if (building.type === "underground") {
          showToast("O par subterrâneo mantém uma linha reta. Remova e reconstrua para girar.");
          return;
        }
        building.dir = (building.dir + 1) % 4;
        cachedNetwork = null;
        showToast(`Saída: ${DIRS[building.dir].label}.`);
      }
      updateUI(true);
    }

    function invertCurrentTarget() {
      if (currentTool) {
        const tool = TOOLS[currentTool];
        if (!tool || (tool.type !== "splitter" && tool.type !== "merger")) {
          showToast("Somente o Divisor e o Combinador podem inverter o lado auxiliar.");
          return;
        }
        buildMirrored = !buildMirrored;
        const preview = { type: tool.type, dir: buildDir, mirrored: buildMirrored };
        const side = modifierAuxiliarySide(preview);
        showToast(`${tool.type === "splitter" ? "Saída" : "Entrada"} auxiliar invertida para ${DIRS[side].label}.`);
      } else {
        const building = buildingById.get(selectedBuildingId);
        if (!canInvertTransport(building)) {
          showToast("Selecione um Divisor ou Combinador para inverter.");
          return;
        }
        building.mirrored = !building.mirrored;
        cachedNetwork = null;
        const side = modifierAuxiliarySide(building);
        showToast(`${building.type === "splitter" ? "Saída" : "Entrada"} auxiliar invertida para ${DIRS[side].label}.`);
      }
      updateUI(true);
    }

    function clearSelection() {
      currentTool = null;
      buildMirrored = false;
      pendingUnderground = null;
      selectedBuildingId = null;
      hoverTile = null;
      for (const button of document.querySelectorAll(".tool")) button.classList.remove("selected");
      updateUI(true);
    }

    function prestigeAvailable() {
      return state.inventory.circuit >= PRESTIGE_CIRCUITS;
    }

    function performPrestige() {
      if (!prestigeAvailable()) return;
      const old = state;
      const fresh = createNewState();
      fresh.economy.prestige = old.economy.prestige + 1;
      fresh.economy.lifetimeEarned = old.economy.lifetimeEarned;
      fresh.economy.researchPoints = old.economy.researchPoints;
      fresh.tech = { ...old.tech };
      fresh.ui.seenHelp = true;
      state = fresh;
      currentTool = null;
      buildMirrored = false;
      pendingUnderground = null;
      selectedBuildingId = null;
      heldMoveDir = null;
      rebuildBuildingIndexes();
      rebuildItemIndex();
      markDefenseFlowDirty();
      snapCameraToPlayer();
      saveGame(false);
      showToast(`Núcleo ${state.economy.prestige}: velocidade +${Math.round(state.economy.prestige * prestigeSpeedPerLevel() * 100)}%.`);
      updateUI(true);
    }

    function resetGame() {
      try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
      state = createNewState();
      isNewGame = false;
      currentTool = null;
      buildMirrored = false;
      pendingUnderground = null;
      selectedBuildingId = null;
      heldMoveDir = null;
      rebuildBuildingIndexes();
      rebuildItemIndex();
      markDefenseFlowDirty();
      snapCameraToPlayer();
      saveGame(false);
      updateUI(true);
      showHelp(true);
    }

    // ---------------------------------------------------------------------
    // Análise de rede e produção offline em lote
    // ---------------------------------------------------------------------
    function traceOutputs(building) {
      const walk = (x, y, sourceX, sourceY, capacity, seen, path) => {
        if (!inBounds(x, y)) return [];
        if (isHub(x, y)) return [{ kind: "hub", capacity, weight: 1, path }];

        const key = posKey(x, y);
        if (seen.has(key)) return [];
        const target = buildingAt(x, y);
        if (!target) return [];
        if (!isTransportBuilding(target)) {
          return [{ kind: "machine", building: target, sourceX, sourceY, capacity, weight: 1, path }];
        }
        if (!transportAcceptsFrom(target, sourceX, sourceY)) return [];

        const nextSeen = new Set(seen);
        nextSeen.add(key);
        let nextPath = [...path, target.id];
        let nextCapacity = Math.min(capacity, transportCapacity(target));

        if (target.type === "underground" && target.role === "entrance") {
          const exit = undergroundPair(target);
          if (!exit) return [];
          const exitKey = posKey(exit.x, exit.y);
          if (nextSeen.has(exitKey)) return [];
          nextSeen.add(exitKey);
          nextPath = [...nextPath, exit.id];
          nextCapacity = Math.min(nextCapacity, transportCapacity(exit));
          const direction = DIRS[exit.dir];
          return walk(exit.x + direction.x, exit.y + direction.y, exit.x, exit.y, nextCapacity, nextSeen, nextPath);
        }

        const directions = target.type === "splitter"
          ? [target.dir, splitterSide(target)]
          : transportOutputDirections(target);
        const branches = directions.map(directionIndex => {
          const direction = DIRS[directionIndex];
          return walk(x + direction.x, y + direction.y, x, y, nextCapacity, new Set(nextSeen), nextPath);
        }).filter(branch => branch.length > 0);

        if (!branches.length) return [];
        const branchWeight = 1 / branches.length;
        return branches.flatMap(branch => branch.map(endpoint => ({ ...endpoint, weight: endpoint.weight * branchWeight })));
      };

      const start = DIRS[building.dir];
      return walk(building.x + start.x, building.y + start.y, building.x, building.y, Infinity, new Set(), []);
    }
