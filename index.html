        <p>Créditos ganhos na rodada: <strong>${formatNumber(state.economy.runEarned)}</strong><br>
        Créditos vitalícios: <strong>${formatNumber(state.economy.lifetimeEarned)}</strong><br>
        Pesquisa disponível: <strong>${formatNumber(state.economy.researchPoints)}</strong><br>
        Tecnologias: <strong>${Object.keys(TECHS).filter(key => hasTech(key)).length}/${Object.keys(TECHS).length}</strong><br>
        Multiplicador global: <strong>${formatNumber(machineMultiplier())}×</strong></p>`;
    }

    function showDefenseStatus() {
      const phaseText = state.combat.phase === "locked"
        ? "Bloqueada até o Tier 2"
        : state.combat.phase === "prep"
          ? `Preparação • ${Math.ceil(state.combat.timer)} s restantes`
          : `Em andamento • ${state.enemies.length + state.combat.spawnRemaining} inimigos restantes`;
      const wallCount = state.buildings.filter(building => building.type === "wall").length;
      const turretCount = state.buildings.filter(building => building.type === "turret").length;
      const nextCount = waveEnemyCount(state.combat.wave);
      const actions = [];
      if (state.combat.phase === "prep") {
        actions.push({ label: `Iniciar Wave ${state.combat.wave} agora`, kind: "danger", onClick: () => startWave(true) });
      }
      actions.push({ label: "Fechar", kind: "primary" });
      openModal(
        `Defesa • Wave ${state.combat.wave}`,
        `<div class="box"><strong>${phaseText}</strong><br>Hub: ${formatNumber(state.combat.baseHp)} / ${HUB_MAX_HP} HP • Munição: ${formatNumber(state.inventory.ammo)}</div>
         <p><strong>Próxima formação:</strong> ${nextCount} invasores, com corredores a cada 4º inimigo e tanques a cada 7º. Eles entram pelas quatro estradas e procuram o caminho de menor resistência até o Hub.</p>
         <p><strong>Sua defesa:</strong> ${wallCount} paredes • ${turretCount} torretas<br>
         Paredes canalizam e absorvem dano. Torretas focam o alvo mais próximo e consomem <strong>${formatNumber(turretAmmoCost())} munição por disparo</strong>.</p>
         <div class="box"><strong>Cadeia de munição</strong><br>Minério de ferro → Fornalha → Placa de ferro → Montadora de Munição → Hub → Torretas</div>
         <p>Waves vencidas: <strong>${state.combat.victories}</strong> • eliminações: <strong>${state.combat.kills}</strong> • derrotas: <strong>${state.combat.defeats}</strong></p>
         <p><strong>Offline justo:</strong> a fábrica continua produzindo com a aba fechada, mas uma wave ativa volta para preparação; o Hub não é destruído offline.</p>`,
        actions
      );
    }

    function showPrestigeConfirmation() {
      openModal(
        "Confirmar prestígio",
        `<p>Isso remove máquinas, upgrades locais, itens, créditos e entregas da rodada.</p>
         <div class="box"><strong>Você mantém:</strong> Pesquisa e tecnologias.<br><strong>Você recebe:</strong> Núcleo ${state.economy.prestige + 1}, com +${Math.round((state.economy.prestige + 1) * prestigeSpeedPerLevel() * 100)}% de velocidade total.</div>`,
        [
          { label: "Cancelar" },
          { label: "Prestigiar", kind: "primary", onClick: performPrestige }
        ]
      );
    }

    function showResetConfirmation() {
      openModal(
        "Apagar todo o progresso?",
        `<p class="bad">Esta ação remove o save, incluindo Pesquisa, tecnologias e todos os níveis de Núcleo. Não pode ser desfeita.</p>`,
        [
          { label: "Cancelar" },
          { label: "Apagar", kind: "danger", onClick: resetGame }
        ]
      );
    }

    function showMenu() {
      openModal(
        "Fábrica e save",
        inventoryHTML(),
        [
          { label: "Salvar agora", onClick: () => saveGame(true) },
          { label: `Tecnologias (${formatNumber(state.economy.researchPoints)} ⚗)`, onClick: showTechTree },
          { label: `Defesa • Wave ${state.combat.wave}`, onClick: showDefenseStatus },
          { label: "Como jogar", onClick: () => showHelp(false) },
          {
            label: prestigeAvailable() ? "Prestigiar" : `Prestígio ${Math.floor(state.inventory.circuit)}/${PRESTIGE_CIRCUITS}`,
            kind: prestigeAvailable() ? "primary" : "",
            disabled: !prestigeAvailable(),
            onClick: showPrestigeConfirmation
          },
          { label: "Apagar save", kind: "danger", onClick: showResetConfirmation },
          { label: "Fechar", kind: "primary" }
        ]
      );
    }

    // ---------------------------------------------------------------------
    // Entrada touch, mouse e teclado
    // ---------------------------------------------------------------------
    function pointerToTile(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const sx = clientX - rect.left;
      const sy = clientY - rect.top;
      return {
        x: Math.floor((sx + camera.x) / TILE),
        y: Math.floor((sy + camera.y) / TILE)
      };
    }

    function directionBetween(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (dx === 0 && dy === -1) return 0;
      if (dx === 1 && dy === 0) return 1;
      if (dx === 0 && dy === 1) return 2;
      if (dx === -1 && dy === 0) return 3;
      return null;
    }

    function paintToolAt(tile, isDrag) {
      if (!inBounds(tile.x, tile.y)) return;
      hoverTile = tile;

      if (!currentTool) {
        if (isDrag) return;
        const selected = buildingAt(tile.x, tile.y);
        selectedBuildingId = selected ? selected.id : null;
        updateUI(true);
        return;
      }

      if (currentTool === "underground") {
        if (!isDrag) placeUndergroundEndpoint(tile.x, tile.y);
        return;
      }

      if (currentTool !== "belt" && currentTool !== "wall") {
        if (!isDrag) placeToolAt(currentTool, tile.x, tile.y, buildDir, false);
        return;
      }

      if (currentTool === "wall") {
        const key = posKey(tile.x, tile.y);
        if (!paintedThisGesture.has(key) && !buildingAt(tile.x, tile.y)) {
          const placed = placeToolAt("wall", tile.x, tile.y, buildDir, true);
          if (placed) paintedThisGesture.add(key);
        }
        lastPaintTile = { x: tile.x, y: tile.y };
        updateUI(true);
        return;
      }

      const key = posKey(tile.x, tile.y);
      if (lastPaintTile && (lastPaintTile.x !== tile.x || lastPaintTile.y !== tile.y)) {
        const dir = directionBetween(lastPaintTile, tile);
        if (dir !== null) {
          const previousKey = posKey(lastPaintTile.x, lastPaintTile.y);
          const previous = buildingAt(lastPaintTile.x, lastPaintTile.y);
          if (previous && previous.type === "belt" && paintedThisGesture.has(previousKey)) {
            previous.dir = dir;
            cachedNetwork = null;
          }
          buildDir = dir;
        }
      }

      if (!paintedThisGesture.has(key) && !buildingAt(tile.x, tile.y)) {
        const placed = placeToolAt("belt", tile.x, tile.y, buildDir, true);
        if (placed) paintedThisGesture.add(key);
      }
      lastPaintTile = { x: tile.x, y: tile.y };
      updateUI(true);
    }

    function toggleToolSelection(key) {
      const tool = TOOLS[key];
      if (!tool) return;
      if (state.economy.tier < tool.tier) {
        showToast(`Requer Tier ${tool.tier}.`);
        return;
      }
      const activating = currentTool !== key;
      pendingUnderground = null;
      buildMirrored = false;
      if (activating && !mobileLayout) desktopBuildOpen = true;
      currentTool = activating ? key : null;
      selectedBuildingId = null;
      if (activating && mobileLayout) setBuildDrawer(false);
      updateUI(true);
    }

    for (const button of document.querySelectorAll(".tool")) {
      button.addEventListener("click", () => toggleToolSelection(button.dataset.tool));
    }

    toolPrevBtn.addEventListener("click", () => setToolPage(toolPageIndex - 1));
    toolNextBtn.addEventListener("click", () => setToolPage(toolPageIndex + 1));
    buildBarElement.addEventListener("scroll", syncToolPageFromScroll, { passive: true });
    buildToggleBtn.addEventListener("click", () => {
      setBuildDrawer(!buildDrawerOpen);
      updateUI(false);
    });

    rotateBtn.addEventListener("click", rotateCurrentTarget);
    invertBtn.addEventListener("click", invertCurrentTarget);
    recipeBtn.addEventListener("click", () => showMachineRecipes(selectedBuildingId));
    deleteBtn.addEventListener("click", removeSelectedBuilding);
    upgradeBtn.addEventListener("click", upgradeSelectedBuilding);
    cancelBtn.addEventListener("click", clearSelection);
    techBtn.addEventListener("click", showTechTree);
    defenseBtn.addEventListener("click", showDefenseStatus);
    document.getElementById("helpBtn").addEventListener("click", () => showHelp(false));
    menuBtn.addEventListener("click", showMenu);
    buildModeBtn.addEventListener("click", () => setDesktopBuildMode(!desktopBuildOpen));

    for (const key of document.querySelectorAll(".dkey[data-dir]")) {
      const startMove = event => {
        event.preventDefault();
        const dir = Number(key.dataset.dir);
        heldMoveDir = dir;
        key.classList.add("pressed");
        attemptMove(dir);
        try { key.setPointerCapture(event.pointerId); } catch (_) {}
      };
      const stopMove = event => {
        event.preventDefault();
        if (heldMoveDir === Number(key.dataset.dir)) heldMoveDir = null;
        key.classList.remove("pressed");
      };
      key.addEventListener("pointerdown", startMove);
      key.addEventListener("pointerup", stopMove);
      key.addEventListener("pointercancel", stopMove);
      key.addEventListener("lostpointercapture", stopMove);
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button === 2) {
        event.preventDefault();
        if (mobileLayout || !desktopBuildOpen) return;
        pointerPainting = false;
        lastPaintTile = null;
        paintedThisGesture.clear();
        const tile = pointerToTile(event.clientX, event.clientY);
        removeBuildingAtTile(tile.x, tile.y);
        return;
      }
      if (event.button !== 0) return;
      event.preventDefault();
      pointerPainting = Boolean(currentTool);
      lastPaintTile = null;
      paintedThisGesture = new Set();
      try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      paintToolAt(pointerToTile(event.clientX, event.clientY), false);
    });

    canvas.addEventListener("pointermove", event => {
      hoverTile = pointerToTile(event.clientX, event.clientY);
      if (pointerPainting && (currentTool === "belt" || currentTool === "wall") && (event.buttons || event.pointerType === "touch")) {
        event.preventDefault();
        paintToolAt(hoverTile, true);
      }
    });

    const stopPainting = event => {
      pointerPainting = false;
      lastPaintTile = null;
      paintedThisGesture.clear();
      try { canvas.releasePointerCapture(event.pointerId); } catch (_) {}
    };
    canvas.addEventListener("pointerup", stopPainting);
    canvas.addEventListener("pointercancel", stopPainting);
    canvas.addEventListener("pointerleave", event => {
      if (!pointerPainting) hoverTile = null;
      if (event.pointerType === "mouse" && !event.buttons) stopPainting(event);
    });
    canvas.addEventListener("contextmenu", event => event.preventDefault());

    const toolHotkeys = new Map([
      ["Digit1", "miner"],
      ["Digit2", "belt"],
      ["Digit3", "furnace"],
      ["Digit4", "assembler"],
      ["Digit5", "splitter"],
      ["Digit6", "underground"],
      ["Digit7", "merger"],
      ["Digit8", "wall"],
      ["Digit9", "turret"]
    ]);

    const keyDirections = new Map([
      ["ArrowUp", 0], ["KeyW", 0],
      ["ArrowRight", 1], ["KeyD", 1],
      ["ArrowDown", 2], ["KeyS", 2],
      ["ArrowLeft", 3], ["KeyA", 3]
    ]);

    window.addEventListener("keydown", event => {
      if (!modalOverlay.hidden) {
        if (event.code === "Escape") {
          event.preventDefault();
          closeModal();
        }
        return;
      }
      if (toolHotkeys.has(event.code)) {
        event.preventDefault();
        toggleToolSelection(toolHotkeys.get(event.code));
      } else if (event.code === "KeyB") {
        event.preventDefault();
        setDesktopBuildMode(!desktopBuildOpen);
      } else if (keyDirections.has(event.code)) {
        event.preventDefault();
        const dir = keyDirections.get(event.code);
        heldMoveDir = dir;
        attemptMove(dir);
      } else if (event.code === "KeyR") {
        event.preventDefault();
        rotateCurrentTarget();
      } else if (event.code === "KeyF") {
        event.preventDefault();
        invertCurrentTarget();
      } else if (event.code === "KeyC") {
        const selected = buildingById.get(selectedBuildingId);
        if (isConfigurableMachine(selected)) {
          event.preventDefault();
          showMachineRecipes(selected.id);
        }
      } else if (event.code === "Delete" || event.code === "Backspace") {
        event.preventDefault();
        if (selectedBuildingId) removeSelectedBuilding();
      } else if (event.code === "KeyU") {
        event.preventDefault();
        if (selectedBuildingId) upgradeSelectedBuilding();
      } else if (event.code === "KeyT") {
        event.preventDefault();
        showTechTree();
      } else if (event.code === "KeyM") {
        event.preventDefault();
        showMenu();
      } else if (event.code === "KeyH") {
        event.preventDefault();
        showHelp(false);
      } else if (event.code === "Escape") {
        event.preventDefault();
        clearSelection();
      }
    });

    window.addEventListener("keyup", event => {
      if (keyDirections.has(event.code) && heldMoveDir === keyDirections.get(event.code)) heldMoveDir = null;
    });

    window.addEventListener("blur", () => { heldMoveDir = null; });
    window.addEventListener("resize", () => {
      resizeCanvas();
      snapCameraToPlayer();
      const nextMobileLayout = window.innerWidth <= 760;
      if (nextMobileLayout !== mobileLayout) {
        mobileLayout = nextMobileLayout;
        buildDrawerOpen = !mobileLayout;
      }
      if (mobileLayout) setToolPage(toolPageIndex);
      else {
        toolPageIndex = 0;
        buildBarElement.scrollLeft = 0;
        updateToolPageButtons();
      }
      syncBuildDrawerUI();
      updateUI(false);
    });

    // ---------------------------------------------------------------------
    // Inicialização, game loop e ciclo de vida mobile
    // ---------------------------------------------------------------------
    state = loadLocalState();
    rebuildBuildingIndexes();
    rebuildItemIndex();
    resizeCanvas();
    snapCameraToPlayer();

    const initialOfflineSeconds = Math.max(0, (Date.now() - state.lastSavedAt) / 1000);
    const initialCombatPaused = initialOfflineSeconds >= 2 && suspendCombatForOffline();
    const initialOfflineSummary = isNewGame ? null : applyOfflineProgress(initialOfflineSeconds);
    if (initialOfflineSummary) initialOfflineSummary.combatPaused = initialCombatPaused;
    state.lastSavedAt = Date.now();
    updateUI(true);
    saveGame(false, true);

    let lastFrameTime = performance.now();
    let accumulator = 0;

    function frame(now) {
      const elapsed = Math.min(MAX_FRAME_DELTA, Math.max(0, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      if (!document.hidden) {
        if (modalOverlay.hidden) {
          accumulator = Math.min(accumulator + elapsed, SIM_STEP * 6);
          let steps = 0;
          while (accumulator >= SIM_STEP && steps < 6) {
            simulateStep(SIM_STEP);
            accumulator -= SIM_STEP;
            steps++;
          }
        } else {
          accumulator = 0;
        }
        render(elapsed);
      }
      requestAnimationFrame(frame);
    }

    document.addEventListener("visibilitychange", () => {
      heldMoveDir = null;
      if (document.hidden) {
        state.lastSavedAt = Date.now();
        saveGame(false, true);
        return;
      }

      const elapsed = Math.max(0, (Date.now() - state.lastSavedAt) / 1000);
      const combatPaused = elapsed >= 2 && suspendCombatForOffline();
      const summary = applyOfflineProgress(elapsed);
      if (summary) summary.combatPaused = combatPaused;
      state.lastSavedAt = Date.now();
      accumulator = 0;
      lastFrameTime = performance.now();
      cachedNetwork = null;
      updateUI(true);
      saveGame(false, true);
      if (summary && summary.usedSeconds >= 5) showOfflineSummary(summary);
    });

    window.addEventListener("pagehide", () => saveGame(false, document.hidden));
    window.addEventListener("beforeunload", () => saveGame(false, document.hidden));

    window.setInterval(() => {
      if (!document.hidden) saveGame(false);
    }, 5000);

    window.setInterval(() => updateUI(false), 250);

    // Pequena API de inspeção e testes locais.
    window.FactoryGridDebug = Object.freeze({
      getState: () => JSON.parse(JSON.stringify(state)),
      getRates: () => JSON.parse(JSON.stringify(calculateNetworkRates())),
      place: (tool, x, y, dir = 1) => placeToolAt(tool, x, y, dir, true),
      placeTunnel: (entryX, entryY, exitX, exitY, dir = 1) => {
        pendingUnderground = null;
        buildDir = clamp(Math.floor(dir), 0, 3);
        currentTool = "underground";
        placeUndergroundEndpoint(Math.floor(entryX), Math.floor(entryY));
        const result = placeUndergroundEndpoint(Math.floor(exitX), Math.floor(exitY));
        pendingUnderground = null;
        currentTool = null;
        return result ? result.id : null;
      },
      rotate: (id, dir) => {
        const building = buildingById.get(String(id));
        if (building && building.type !== "underground") {
          building.dir = clamp(Math.floor(dir), 0, 3);
          cachedNetwork = null;
        }
      },
      invert: id => {
        currentTool = null;
        selectedBuildingId = String(id);
        invertCurrentTarget();
      },
      recipe: (id, key) => applyMachineRecipe(String(id), String(key)),
      grantCredits: amount => {
        state.economy.credits += Math.max(0, Number(amount) || 0);
        state.economy.tier = 3;
        unlockCombatIfNeeded(true);
        updateUI(true);
      },
      grantAmmo: amount => {
        state.inventory.ammo += Math.max(0, Number(amount) || 0);
        updateUI(true);
      },
      startWave: () => startWave(true),
      combat: () => JSON.parse(JSON.stringify({ combat: state.combat, enemies: state.enemies })),
      grantResearch: amount => {
        state.economy.researchPoints += Math.max(0, Number(amount) || 0);
        updateUI(true);
      },
      buyTech: key => buyTech(String(key)),
      upgrade: id => {
        selectedBuildingId = String(id);
        upgradeSelectedBuilding();
      },
      remove: id => {
        selectedBuildingId = String(id);
        removeSelectedBuilding();
      },
      step: seconds => {
        const steps = Math.min(36000, Math.max(0, Math.ceil((Number(seconds) || 0) / SIM_STEP)));
        for (let index = 0; index < steps; index++) simulateStep(SIM_STEP);
        return JSON.parse(JSON.stringify(state));
      },
      setBuildMode: open => setDesktopBuildMode(Boolean(open), false),
      removeAt: (x, y) => desktopBuildOpen && removeBuildingAtTile(Math.floor(x), Math.floor(y)),
      prestige: performPrestige,
      save: () => saveGame(false),
      clear: resetGame
    });

    requestAnimationFrame(frame);
    window.setTimeout(() => {
      if (!state.ui.seenHelp) showHelp(true);
      else if (initialOfflineSummary && initialOfflineSummary.usedSeconds >= 5) showOfflineSummary(initialOfflineSummary);
    }, 120);
  })();
  </script>
</body>
</html>
