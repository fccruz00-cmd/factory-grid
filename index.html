    function addRate(object, kind, rate) {
      object[kind] = (object[kind] || 0) + rate;
    }

    function calculateNetworkRates() {
      const hubRates = EMPTY_INVENTORY();
      const inputs = new Map();
      const transportUsage = new Map();

      const inputBucket = building => {
        if (!inputs.has(building.id)) inputs.set(building.id, {});
        return inputs.get(building.id);
      };

      const routeRate = (building, kind, rate) => {
        if (!(rate > 0)) return;
        const endpoints = traceOutputs(building);
        if (!endpoints.length) return;
        const totalWeight = endpoints.reduce((total, endpoint) => total + endpoint.weight, 0) || 1;

        for (const endpoint of endpoints) {
          const desiredRate = rate * endpoint.weight / totalWeight;
          let availableRate = endpoint.capacity ?? Infinity;
          for (const id of endpoint.path || []) {
            const transport = buildingById.get(id);
            if (!transport) continue;
            availableRate = Math.min(availableRate, Math.max(0, transportCapacity(transport) - (transportUsage.get(id) || 0)));
          }
          const routedRate = Math.min(desiredRate, availableRate);
          if (!(routedRate > 0)) continue;

          let accepted = false;
          if (endpoint.kind === "hub") {
            addRate(hubRates, kind, routedRate);
            accepted = true;
          } else if (machineAcceptsFrom(endpoint.building, kind, endpoint.sourceX, endpoint.sourceY)) {
            addRate(inputBucket(endpoint.building), kind, routedRate);
            accepted = true;
          }
          if (accepted) {
            for (const id of endpoint.path || []) {
              transportUsage.set(id, (transportUsage.get(id) || 0) + routedRate);
            }
          }
        }
      };

      for (const miner of state.buildings.filter(b => b.type === "miner")) {
        const kind = getDeposit(miner.x, miner.y);
        if (kind) routeRate(miner, kind, buildingSpeedMultiplier(miner) / MINER_INTERVAL);
      }

      const productionBuildings = state.buildings
        .filter(building => building.type === "furnace" || building.type === "assembler")
        .sort((a, b) => (RECIPES[a.recipe]?.stage || 99) - (RECIPES[b.recipe]?.stage || 99));

      for (const machine of productionBuildings) {
        const recipe = RECIPES[machine.recipe];
        if (!recipe || recipe.machine !== machine.type) continue;
        const bucket = inputs.get(machine.id) || {};
        let rate = buildingSpeedMultiplier(machine) / recipe.duration;
        for (const [kind, amount] of Object.entries(recipe.inputs)) {
          rate = Math.min(rate, (bucket[kind] || 0) / amount);
        }
        routeRate(machine, recipe.output, rate * Math.max(1, Number(recipe.outputAmount) || 1));
      }

      let creditsPerSecond = 0;
      for (const [kind, rate] of Object.entries(hubRates)) {
        creditsPerSecond += rate * itemCreditValue(kind);
      }
      return { itemRates: hubRates, creditsPerSecond };
    }

    function applyOfflineProgress(realSeconds) {
      const usedSeconds = Math.min(Math.max(0, realSeconds), offlineMaxSeconds());
      if (usedSeconds < 2) return null;
      const network = calculateNetworkRates();
      const produced = EMPTY_INVENTORY();
      let earned = 0;
      const researchBefore = state.economy.researchPoints;

      for (const [kind, rate] of Object.entries(network.itemRates)) {
        const quantity = Math.floor(rate * usedSeconds);
        if (quantity <= 0) continue;
        produced[kind] = quantity;
        deliverItem(kind, quantity);
        earned += quantity * itemCreditValue(kind);
      }

      state.stats.offlineSeconds += usedSeconds;
      updateTier(true);
      return {
        realSeconds,
        usedSeconds,
        capped: realSeconds > usedSeconds + 0.5,
        ticks: Math.floor(usedSeconds / SIM_STEP),
        produced,
        earned,
        researchEarned: state.economy.researchPoints - researchBefore
      };
    }

    // ---------------------------------------------------------------------
    // Persistência
    // ---------------------------------------------------------------------
    function saveGame(manual = false, preserveTimestamp = false) {
      try {
        if (!preserveTimestamp) state.lastSavedAt = Date.now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        flashSaveIndicator();
        if (manual) showToast("Jogo salvo neste navegador.");
        return true;
      } catch (error) {
        console.warn("Falha ao salvar.", error);
        if (manual) showToast("Não foi possível gravar o save neste navegador.");
        return false;
      }
    }

    // ---------------------------------------------------------------------
    // Renderização Canvas 2D
    // ---------------------------------------------------------------------
    let viewW = window.innerWidth;
    let viewH = window.innerHeight;
    let dpr = 1;
    const camera = { x: 0, y: 0 };

    function resizeCanvas() {
      viewW = Math.max(1, window.innerWidth);
      viewH = Math.max(1, window.innerHeight);
      dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      canvas.width = Math.round(viewW * dpr);
      canvas.height = Math.round(viewH * dpr);
      canvas.style.width = `${viewW}px`;
      canvas.style.height = `${viewH}px`;
      ctx.imageSmoothingEnabled = false;
    }

    function smoothStep(value) {
      const t = clamp(value, 0, 1);
      return t * t * (3 - 2 * t);
    }

    function playerVisualTile() {
      const player = state.player;
      if (!player.moving) return { x: player.x, y: player.y };
      const t = smoothStep(player.moveProgress);
      return {
        x: player.x + (player.tx - player.x) * t,
        y: player.y + (player.ty - player.y) * t
      };
    }

    function cameraTarget() {
      const player = playerVisualTile();
      const worldPixelsW = WORLD_W * TILE;
      const worldPixelsH = WORLD_H * TILE;
      let x = (player.x + 0.5) * TILE - viewW / 2;
      let y = (player.y + 0.5) * TILE - viewH / 2;
      x = worldPixelsW <= viewW ? (worldPixelsW - viewW) / 2 : clamp(x, 0, worldPixelsW - viewW);
      y = worldPixelsH <= viewH ? (worldPixelsH - viewH) / 2 : clamp(y, 0, worldPixelsH - viewH);
      return { x, y };
    }

    function snapCameraToPlayer() {
      if (!state) return;
      const target = cameraTarget();
      camera.x = target.x;
      camera.y = target.y;
    }

    function updateCamera(dt) {
      const target = cameraTarget();
      const follow = 1 - Math.exp(-dt * 9);
      camera.x += (target.x - camera.x) * follow;
      camera.y += (target.y - camera.y) * follow;
    }

    function roundedRectPath(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + width - r, y);
      context.quadraticCurveTo(x + width, y, x + width, y + r);
      context.lineTo(x + width, y + height - r);
      context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      context.lineTo(x + r, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();
    }

    function drawTerrainTile(x, y, time) {
      const px = x * TILE;
      const py = y * TILE;
      const tile = terrain[y][x];
      const noise = hash2(x, y);

      if (tile === 2) {
        ctx.fillStyle = noise > 0.5 ? "#2c6f78" : "#2a6772";
        ctx.fillRect(px, py, TILE, TILE);
        ctx.strokeStyle = "rgba(150,224,214,.24)";
        ctx.lineWidth = 2;
        const wave = ((time * 15 + x * 7 + y * 11) % 18) - 4;
        ctx.beginPath();
        ctx.moveTo(px + 5 + wave, py + 12);
        ctx.lineTo(px + 17 + wave, py + 12);
        ctx.moveTo(px + 12 - wave * 0.4, py + 28);
        ctx.lineTo(px + 24 - wave * 0.4, py + 28);
        ctx.stroke();
      } else if (tile === 1) {
        ctx.fillStyle = noise > 0.5 ? "#9b8155" : "#947a50";
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = "rgba(74,56,32,.18)";
        ctx.fillRect(px + 7 + Math.floor(noise * 9), py + 9, 3, 2);
        ctx.fillRect(px + 23, py + 27 - Math.floor(noise * 5), 4, 2);
      } else {
        ctx.fillStyle = noise > 0.55 ? "#4f8c57" : "#4a8552";
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = noise > 0.4 ? "rgba(164,207,113,.22)" : "rgba(29,89,48,.2)";
        ctx.fillRect(px + 5 + Math.floor(noise * 17), py + 7 + Math.floor(noise * 13), 3, 4);
        ctx.fillRect(px + 28 - Math.floor(noise * 8), py + 29, 2, 3);
      }

      if (tile === 3) drawTree(px, py, noise);
      if (tile === 4) drawRock(px, py, "#6d7773", "#3f4b47", noise);
      const deposit = getDeposit(x, y);
      if (deposit) drawDeposit(px, py, deposit, noise);

      ctx.strokeStyle = "rgba(16,46,29,.15)";
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
    }

    function drawTree(px, py, noise) {
      ctx.fillStyle = "#63482c";
      ctx.fillRect(px + 17, py + 21, 7, 15);
      ctx.fillStyle = "#1e5c35";
      ctx.beginPath();
      ctx.arc(px + 20, py + 17, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#347d43";
      ctx.beginPath();
      ctx.arc(px + 15 + noise * 4, py + 13, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(197,230,123,.25)";
      ctx.fillRect(px + 12, py + 8, 5, 4);
    }

    function drawRock(px, py, fill, edge, noise = 0.5) {
      ctx.fillStyle = edge;
      ctx.beginPath();
      ctx.moveTo(px + 7, py + 29);
      ctx.lineTo(px + 10, py + 14);
      ctx.lineTo(px + 19, py + 7 + noise * 3);
      ctx.lineTo(px + 31, py + 13);
      ctx.lineTo(px + 34, py + 29);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(px + 11, py + 25);
      ctx.lineTo(px + 14, py + 14);
      ctx.lineTo(px + 21, py + 11);
      ctx.lineTo(px + 29, py + 16);
      ctx.lineTo(px + 31, py + 25);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.2)";
      ctx.fillRect(px + 16, py + 14, 7, 3);
    }

    function drawDeposit(px, py, kind, noise) {
      const item = ITEMS[kind];
      ctx.fillStyle = kind === "ironOre" ? "rgba(103,119,114,.22)" : "rgba(176,91,47,.22)";
      ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
      const dots = [
        [10, 12, 6], [25, 10, 5], [18, 25, 7], [31, 27, 4]
      ];
      for (let i = 0; i < dots.length; i++) {
        const [dx, dy, size] = dots[i];
        ctx.fillStyle = item.edge;
        ctx.fillRect(px + dx - 1, py + dy + 1, size + 2, size);
        ctx.fillStyle = item.color;
        ctx.fillRect(px + dx, py + dy, size, size - 1);
        if ((i + Math.floor(noise * 5)) % 2 === 0) {
          ctx.fillStyle = "rgba(255,255,255,.28)";
          ctx.fillRect(px + dx + 1, py + dy + 1, 2, 2);
        }
      }
    }

    function drawDirectionArrow(cx, cy, dirIndex, color, size = 10) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(dirIndex * Math.PI / 2);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = Math.max(2, size * 0.24);
      ctx.lineCap = "square";
      ctx.beginPath();
      ctx.moveTo(0, size * 0.55);
      ctx.lineTo(0, -size * 0.45);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(-size * 0.55, -size * 0.35);
      ctx.lineTo(size * 0.55, -size * 0.35);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawMachinePorts(building, hasInputs = true) {
      const cx = (building.x + 0.5) * TILE;
      const cy = (building.y + 0.5) * TILE;

      if (hasInputs) {
        for (let side = 0; side < 4; side++) {
          if (side === building.dir) continue;
          const sideDir = DIRS[side];
          const px = cx + sideDir.x * 16;
          const py = cy + sideDir.y * 16;
          ctx.fillStyle = "rgba(16,58,70,.82)";
          ctx.beginPath();
          ctx.arc(px, py, 5.5, 0, Math.PI * 2);
          ctx.fill();
          drawDirectionArrow(px, py, (side + 2) % 4, "#72d4ee", 4.5);
        }
      }

      const outDir = DIRS[building.dir];
      const outX = cx + outDir.x * 16;
      const outY = cy + outDir.y * 16;
      ctx.fillStyle = "rgba(75,59,18,.88)";
      ctx.beginPath();
      ctx.arc(outX, outY, 6, 0, Math.PI * 2);
      ctx.fill();
      drawDirectionArrow(outX, outY, building.dir, "#ffe073", 5.5);
    }

    function drawHub(time) {
      const px = HUB.x * TILE;
      const py = HUB.y * TILE;
      ctx.fillStyle = "rgba(3,10,7,.35)";
      ctx.fillRect(px + 5, py + 7, TILE - 7, TILE - 5);
      ctx.fillStyle = "#c49a42";
      ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = "#4b4430";
      ctx.fillRect(px + 8, py + 8, TILE - 16, TILE - 16);
      const pulse = 0.5 + Math.sin(time * 3.5) * 0.13;
      ctx.fillStyle = `rgba(113,231,151,${pulse})`;
      ctx.fillRect(px + 13, py + 13, TILE - 26, TILE - 26);
      ctx.strokeStyle = "#f7dc78";
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = "#fff2b0";
      ctx.font = "bold 8px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText("HUB", px + TILE / 2, py - 3);
      const hpRatio = clamp(state.combat.baseHp / HUB_MAX_HP, 0, 1);
      ctx.fillStyle = "#271512";
      ctx.fillRect(px + 3, py + TILE + 2, TILE - 6, 5);
      ctx.fillStyle = hpRatio > 0.5 ? "#70d58d" : hpRatio > 0.25 ? "#e5b95b" : "#ef7168";
      ctx.fillRect(px + 4, py + TILE + 3, (TILE - 8) * hpRatio, 3);
    }

    function drawBelt(building, time) {
      const px = building.x * TILE;
      const py = building.y * TILE;
      ctx.fillStyle = "rgba(5,11,8,.34)";
      ctx.fillRect(px + 4, py + 6, TILE - 5, TILE - 4);
      ctx.fillStyle = "#263733";
      ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.strokeStyle = "#71817b";
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 4, py + 4, TILE - 8, TILE - 8);

      ctx.save();
      ctx.translate(px + TILE / 2, py + TILE / 2);
      ctx.rotate(building.dir * Math.PI / 2);
      const phase = (time * 18) % 12;
      ctx.strokeStyle = "#8ea19a";
      ctx.lineWidth = 3;
      for (let y = -23 + phase; y < 23; y += 12) {
        ctx.beginPath();
        ctx.moveTo(-7, y + 4);
        ctx.lineTo(0, y - 2);
        ctx.lineTo(7, y + 4);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTransportFrame(building, fill = "#263733", edge = "#71817b") {
      const px = building.x * TILE;
      const py = building.y * TILE;
      ctx.fillStyle = "rgba(5,11,8,.38)";
      ctx.fillRect(px + 4, py + 6, TILE - 5, TILE - 4);
      ctx.fillStyle = fill;
      ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.strokeStyle = edge;
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 4, py + 4, TILE - 8, TILE - 8);
    }

    function drawTransportPorts(building, inputSides, outputSides) {
      const cx = (building.x + 0.5) * TILE;
      const cy = (building.y + 0.5) * TILE;
      for (const side of inputSides) {
        const direction = DIRS[side];
        const px = cx + direction.x * 16;
        const py = cy + direction.y * 16;
        ctx.fillStyle = "rgba(16,58,70,.94)";
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fill();
        drawDirectionArrow(px, py, (side + 2) % 4, "#72d4ee", 5);
      }
      for (const side of outputSides) {
        const direction = DIRS[side];
        const px = cx + direction.x * 16;
        const py = cy + direction.y * 16;
        ctx.fillStyle = "rgba(75,59,18,.96)";
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fill();
        drawDirectionArrow(px, py, side, "#ffe073", 5.5);
      }
    }

    function drawSplitter(building, time) {
      drawTransportFrame(building, "#29413f", "#7d9991");
      const cx = (building.x + 0.5) * TILE;
      const cy = (building.y + 0.5) * TILE;
      const forward = building.dir;
      const side = splitterSide(building);
      ctx.strokeStyle = "#9db8b0";
      ctx.lineWidth = 4;
      ctx.lineCap = "square";
      for (const output of [forward, side]) {
        const direction = DIRS[output];
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + direction.x * 11, cy + direction.y * 11);
        ctx.stroke();
      }
      const active = building.splitToggle ? side : forward;
      drawDirectionArrow(cx, cy, active, `rgba(255,224,115,${0.72 + Math.sin(time * 5) * 0.18})`, 7);
      drawTransportPorts(building, [(building.dir + 2) % 4], [forward, side]);
    }

    function drawMerger(building) {
      drawTransportFrame(building, "#303b49", "#8293a8");
      const cx = (building.x + 0.5) * TILE;
      const cy = (building.y + 0.5) * TILE;
      const inputs = mergerInputSides(building);
      ctx.strokeStyle = "#91abc3";
      ctx.lineWidth = 4;
      for (const input of inputs) {
        const direction = DIRS[input];
        ctx.beginPath();
        ctx.moveTo(cx + direction.x * 11, cy + direction.y * 11);
        ctx.lineTo(cx, cy);
        ctx.stroke();
      }
      drawDirectionArrow(cx, cy, building.dir, "#ffe073", 7);
      drawTransportPorts(building, inputs, [building.dir]);
    }

    function drawUnderground(building, time) {
      const pair = undergroundPair(building);
      if (building.role === "entrance" && pair) {
        const cx = (building.x + 0.5) * TILE;
        const cy = (building.y + 0.5) * TILE;
        const px = (pair.x + 0.5) * TILE;
        const py = (pair.y + 0.5) * TILE;
        ctx.save();
        ctx.strokeStyle = "rgba(92,190,215,.32)";
        ctx.lineWidth = 6;
        ctx.setLineDash([5, 7]);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(px, py);
        ctx.stroke();
        ctx.restore();
      }

      drawTransportFrame(building, building.role === "entrance" ? "#263b42" : "#334348", "#5fa3b6");
      const px = building.x * TILE;
      const py = building.y * TILE;
      const pulse = 0.72 + Math.sin(time * 4) * 0.14;
      ctx.fillStyle = `rgba(94,205,226,${pulse})`;
      ctx.font = "bold 9px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(building.role === "entrance" ? "IN" : "OUT", px + TILE / 2, py + TILE / 2 + 3);
      ctx.strokeStyle = "rgba(167,224,233,.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px + TILE / 2, py + TILE / 2 + (building.role === "entrance" ? 5 : -5), 9, Math.PI, 0);
      ctx.stroke();
      if (building.role === "entrance") {
        drawTransportPorts(building, [(building.dir + 2) % 4], []);
      } else {
        drawTransportPorts(building, [], [building.dir]);
      }
    }

    function drawMachineBase(px, py, fill, edge) {
      ctx.fillStyle = "rgba(4,10,7,.42)";
      ctx.fillRect(px + 5, py + 8, TILE - 6, TILE - 5);
      ctx.fillStyle = edge;
      ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = fill;
      ctx.fillRect(px + 7, py + 7, TILE - 14, TILE - 14);
      ctx.fillStyle = "rgba(255,255,255,.15)";
      ctx.fillRect(px + 8, py + 8, TILE - 17, 3);
    }

    function drawProgressBar(px, py, progress, color) {
      const amount = clamp(progress, 0, 1);
      ctx.fillStyle = "#101b16";
      ctx.fillRect(px + 7, py + TILE - 8, TILE - 14, 4);
      ctx.fillStyle = color;
      ctx.fillRect(px + 8, py + TILE - 7, (TILE - 16) * amount, 2);
    }

    function drawMiner(building, time) {
      const px = building.x * TILE;
      const py = building.y * TILE;
      const deposit = getDeposit(building.x, building.y);
      const tint = deposit === "copperOre" ? "#b86f46" : "#73817c";
      drawMachineBase(px, py, tint, "#303b38");
      ctx.save();
      ctx.translate(px + TILE / 2, py + 20);
      ctx.rotate(Math.sin(time * 5 + Number(building.id.slice(1))) * 0.36);
      ctx.strokeStyle = "#e3c782";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.lineTo(0, -8);
      ctx.stroke();
      ctx.strokeStyle = "#e9ece6";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-7, -8);
      ctx.lineTo(7, -8);
      ctx.stroke();
      ctx.restore();
      drawMachinePorts(building, false);
      drawProgressBar(px, py, building.cooldown / MINER_INTERVAL, "#f0cc65");
    }

    function drawFurnace(building, time) {
      const px = building.x * TILE;
      const py = building.y * TILE;
      const recipe = RECIPES[building.recipe] || RECIPES.ironPlate;
      drawMachineBase(px, py, recipe.tint, "#493f39");
      ctx.fillStyle = "#251e1a";
      ctx.fillRect(px + 12, py + 13, 16, 14);
      const glow = 0.68 + Math.sin(time * 7) * 0.15;
      ctx.fillStyle = building.recipe === "ironPlate" ? `rgba(255,188,69,${glow})` : `rgba(255,123,55,${glow})`;
      ctx.fillRect(px + 15, py + 17, 10, 7);
      ctx.fillStyle = "#fff4d1";
      ctx.font = "bold 8px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(recipe.icon, px + 20, py + 10);
      drawMachinePorts(building, true);
      drawProgressBar(px, py, building.progress / recipe.duration, recipe.tint);
    }

    function drawAssembler(building, time) {
      const px = building.x * TILE;
      const py = building.y * TILE;
      const recipe = RECIPES[building.recipe] || RECIPES.copperWire;
      drawMachineBase(px, py, recipe.tint, "#2d3d49");
      ctx.save();
      ctx.translate(px + TILE / 2, py + TILE / 2 - 1);
      ctx.rotate(time * 1.8);
      ctx.fillStyle = ITEMS[recipe.output].color;
      for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-3, -12, 6, 8);
      }
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ITEMS[recipe.output].edge;
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#dff6e4";
      ctx.font = "bold 6px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(Object.keys(recipe.inputs).map(kind => ITEMS[kind].short).join("+"), px + TILE / 2, py + 9);
      drawMachinePorts(building, true);
      drawProgressBar(px, py, building.progress / recipe.duration, recipe.tint);
    }

    function drawWall(building) {
      const px = building.x * TILE;
      const py = building.y * TILE;
      ctx.fillStyle = "rgba(4,8,7,.4)";
      ctx.fillRect(px + 2, py + 6, TILE - 2, TILE - 4);
      ctx.fillStyle = "#4b5754";
      ctx.fillRect(px + 1, py + 5, TILE - 2, TILE - 10);
      ctx.fillStyle = "#76827e";
      ctx.fillRect(px + 3, py + 7, TILE - 6, TILE - 15);
      ctx.fillStyle = "#a0aaa6";
      for (let x = 4; x < TILE - 4; x += 10) ctx.fillRect(px + x, py + 3, 7, 8);
      ctx.strokeStyle = "rgba(34,43,40,.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 4, py + 18);
      ctx.lineTo(px + TILE - 4, py + 18);
      ctx.moveTo(px + 13, py + 8);
      ctx.lineTo(px + 13, py + 18);
      ctx.moveTo(px + 27, py + 18);
      ctx.lineTo(px + 27, py + 30);
      ctx.stroke();

      const hpRatio = clamp(building.hp / maxBuildingHp("wall", building.level), 0, 1);
      if (hpRatio < 0.72) {
        ctx.strokeStyle = hpRatio < 0.35 ? "#322825" : "#4a4540";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + 21, py + 8);
        ctx.lineTo(px + 18, py + 16);
        ctx.lineTo(px + 24, py + 22);
        ctx.lineTo(px + 20, py + 31);
        ctx.stroke();
      }
    }

    function drawTurret(building, time) {
      const px = building.x * TILE;
      const py = building.y * TILE;
      const cx = px + TILE / 2;
      const cy = py + TILE / 2;
      if (building.id === selectedBuildingId) {
        ctx.save();
        ctx.strokeStyle = "rgba(246,205,94,.34)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(cx, cy, turretRange(building) * TILE, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.fillStyle = "rgba(3,8,6,.42)";
      ctx.fillRect(px + 6, py + 8, TILE - 10, TILE - 8);
      ctx.fillStyle = "#354740";
      ctx.fillRect(px + 6, py + 7, TILE - 12, TILE - 12);
      ctx.strokeStyle = "#82958c";
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 7, py + 8, TILE - 14, TILE - 14);
      ctx.fillStyle = "#657970";
      ctx.beginPath();
      ctx.arc(cx, cy, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#26342f";
      ctx.stroke();

      const angle = Number(building.aimAngle) || -Math.PI / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillStyle = "#d2b762";
      ctx.fillRect(0, -3, 17, 6);
      ctx.fillStyle = "#f2dc82";
      ctx.fillRect(12, -2, 7, 4);
      ctx.restore();
      ctx.fillStyle = "#17231e";
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();

      if (building.shotFlash > 0) {
        ctx.save();
        ctx.globalAlpha = clamp(building.shotFlash / 0.13, 0, 1);
        ctx.strokeStyle = "#ffe99a";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * 15, cy + Math.sin(angle) * 15);
        ctx.lineTo((building.shotX + 0.5) * TILE, (building.shotY + 0.5) * TILE);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawBuilding(building, time) {
      if (building.type === "belt") drawBelt(building, time);
      else if (building.type === "splitter") drawSplitter(building, time);
      else if (building.type === "underground") drawUnderground(building, time);
      else if (building.type === "merger") drawMerger(building, time);
      else if (building.type === "miner") drawMiner(building, time);
      else if (building.type === "furnace") drawFurnace(building, time);
      else if (building.type === "assembler") drawAssembler(building, time);
      else if (building.type === "wall") drawWall(building);
      else if (building.type === "turret") drawTurret(building, time);

      const maximumHp = maxBuildingHp(building.type, building.level);
      if (building.hp < maximumHp - 0.5) {
        const ratio = clamp(building.hp / maximumHp, 0, 1);
        const px = building.x * TILE;
        const py = building.y * TILE;
        ctx.fillStyle = "rgba(24,12,10,.92)";
        ctx.fillRect(px + 5, py + TILE - 5, TILE - 10, 4);
        ctx.fillStyle = ratio > 0.5 ? "#70d58d" : ratio > 0.25 ? "#e8b85a" : "#ef7168";
        ctx.fillRect(px + 6, py + TILE - 4, (TILE - 12) * ratio, 2);
      }

      if ((building.level || 1) > 1) {
        const px = building.x * TILE;
        const py = building.y * TILE;
        ctx.fillStyle = "#1f718a";
        ctx.beginPath();
        ctx.arc(px + 7, py + 7, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e5fbff";
        ctx.font = "bold 6px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(building.level), px + 7, py + 7.5);
        ctx.textBaseline = "alphabetic";
      }

      if (building.id === selectedBuildingId) {
        ctx.strokeStyle = "#ffe477";
        ctx.lineWidth = 3;
        ctx.strokeRect(building.x * TILE + 2, building.y * TILE + 2, TILE - 4, TILE - 4);
      }
    }

    function drawItem(item) {
      const transport = buildingAt(item.x, item.y);
      if (!isTransportBuilding(transport)) return;
      const directionIndex = transport.type === "splitter" ? transportOutputDirections(transport)[0] : transport.dir;
      const dir = DIRS[directionIndex];
      const progress = clamp(item.progress, 0, 1);
      const hiddenTravel = transport.type === "underground" && transport.role === "entrance";
      const cx = (item.x + 0.5 + (hiddenTravel ? 0 : dir.x * progress)) * TILE;
      const cy = (item.y + 0.5 + (hiddenTravel ? 0 : dir.y * progress)) * TILE;
      const data = ITEMS[item.kind];
      ctx.save();
      if (hiddenTravel) ctx.globalAlpha = 1 - progress * 0.58;
      ctx.fillStyle = "rgba(0,0,0,.35)";
      ctx.fillRect(cx - 7, cy - 5, 15, 15);
      ctx.fillStyle = data.edge;
      ctx.fillRect(cx - 7, cy - 7, 14, 14);
      ctx.fillStyle = data.color;
      ctx.fillRect(cx - 5, cy - 5, 10, 10);
      ctx.fillStyle = item.kind === "circuit" ? "#173b25" : "#18211e";
      ctx.font = "bold 7px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(data.short, cx, cy + 0.5);
      ctx.textBaseline = "alphabetic";
      ctx.restore();
    }

    function drawPlayer(time) {
      const player = playerVisualTile();
      const cx = (player.x + 0.5) * TILE;
      const cy = (player.y + 0.5) * TILE;
      const bob = state.player.moving ? Math.sin(state.player.moveProgress * Math.PI * 2) * 1.5 : Math.sin(time * 2) * 0.4;
      ctx.fillStyle = "rgba(4,10,7,.38)";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 12, 11, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#263b62";
      ctx.fillRect(cx - 8, cy + 1 + bob, 16, 13);
      ctx.fillStyle = "#4e8fd0";
      ctx.fillRect(cx - 6, cy - 1 + bob, 12, 13);
      ctx.fillStyle = "#e9bc8f";
      ctx.fillRect(cx - 7, cy - 13 + bob, 14, 13);
      ctx.fillStyle = "#3a2822";
      ctx.fillRect(cx - 7, cy - 15 + bob, 14, 5);
      ctx.fillRect(cx - 7, cy - 10 + bob, 3, 5);
      const faceDir = DIRS[state.player.dir];
      ctx.fillStyle = "#28302e";
      if (faceDir.x !== 0) {
        ctx.fillRect(cx + faceDir.x * 5 - 1, cy - 7 + bob, 2, 2);
      } else if (faceDir.y > 0) {
        ctx.fillRect(cx - 4, cy - 7 + bob, 2, 2);
        ctx.fillRect(cx + 2, cy - 7 + bob, 2, 2);
      }
      ctx.fillStyle = "#344d35";
      ctx.fillRect(cx - 8, cy + 13 + bob, 6, 4);
      ctx.fillRect(cx + 2, cy + 13 + bob, 6, 4);
    }

    function drawEnemy(enemy, time) {
      const position = enemyVisualPosition(enemy);
      const cx = (position.x + 0.5) * TILE;
      const cy = (position.y + 0.5) * TILE;
      const tank = enemy.kind === "tank";
      const runner = enemy.kind === "runner";
      const size = tank ? 14 : runner ? 9 : 11;
      const bob = Math.sin(time * (runner ? 10 : 6) + Number(enemy.id.slice(1))) * 1.3;
      ctx.fillStyle = "rgba(25,5,5,.38)";
      ctx.beginPath();
      ctx.ellipse(cx, cy + size * 0.7, size, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = tank ? "#743f45" : runner ? "#9b4f68" : "#87464c";
      ctx.fillRect(cx - size / 2, cy - size / 2 + bob, size, size);
      ctx.fillStyle = tank ? "#a76359" : "#bd6b62";
      ctx.fillRect(cx - size / 2 + 2, cy - size / 2 + 2 + bob, size - 4, Math.max(4, size - 6));
      ctx.fillStyle = "#ffe06f";
      ctx.fillRect(cx - 4, cy - 2 + bob, 2, 2);
      ctx.fillRect(cx + 2, cy - 2 + bob, 2, 2);
      if (tank) {
        ctx.fillStyle = "#4c3434";
        ctx.fillRect(cx - 10, cy - 9 + bob, 20, 4);
      }
      const hpRatio = clamp(enemy.hp / enemy.maxHp, 0, 1);
      ctx.fillStyle = "#28100f";
      ctx.fillRect(cx - 12, cy - size / 2 - 8 + bob, 24, 4);
      ctx.fillStyle = hpRatio > 0.5 ? "#e16764" : "#f0a05d";
      ctx.fillRect(cx - 11, cy - size / 2 - 7 + bob, 22 * hpRatio, 2);
    }

    function drawEnemySpawns(time) {
      const danger = state.combat.phase === "active";
      for (const spawn of ENEMY_SPAWNS) {
        const cx = (spawn.x + 0.5) * TILE;
        const cy = (spawn.y + 0.5) * TILE;
        const pulse = 0.55 + Math.sin(time * 4 + spawn.x + spawn.y) * 0.18;
        ctx.fillStyle = danger ? `rgba(214,78,70,${pulse})` : "rgba(168,116,63,.42)";
        ctx.beginPath();
        ctx.arc(cx, cy, danger ? 11 : 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff1bc";
        ctx.font = "bold 9px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText(danger ? "!" : "◇", cx, cy + 3);
      }
    }

    function drawGhost() {
      if (pendingUnderground) {
        const entryX = (pendingUnderground.x + 0.5) * TILE;
        const entryY = (pendingUnderground.y + 0.5) * TILE;
        ctx.save();
        if (hoverTile && inBounds(hoverTile.x, hoverTile.y)) {
          const dir = DIRS[pendingUnderground.dir];
          const dx = hoverTile.x - pendingUnderground.x;
          const dy = hoverTile.y - pendingUnderground.y;
          const distance = dx * dir.x + dy * dir.y;
          const aligned = dx * dir.y - dy * dir.x === 0 && distance >= 2 && distance <= 6;
          ctx.strokeStyle = aligned ? "rgba(105,222,239,.78)" : "rgba(255,112,104,.72)";
          ctx.lineWidth = 5;
          ctx.setLineDash([7, 6]);
          ctx.beginPath();
          ctx.moveTo(entryX, entryY);
          ctx.lineTo((hoverTile.x + 0.5) * TILE, (hoverTile.y + 0.5) * TILE);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(35,66,76,.92)";
        ctx.fillRect(pendingUnderground.x * TILE + 4, pendingUnderground.y * TILE + 4, TILE - 8, TILE - 8);
        ctx.strokeStyle = "#70d9eb";
        ctx.lineWidth = 2;
        ctx.strokeRect(pendingUnderground.x * TILE + 4, pendingUnderground.y * TILE + 4, TILE - 8, TILE - 8);
        ctx.fillStyle = "#dffaff";
        ctx.font = "bold 9px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText("IN", entryX, entryY + 3);
        ctx.restore();
      }

      if (!currentTool || !hoverTile || !inBounds(hoverTile.x, hoverTile.y)) return;
      const tool = TOOLS[currentTool];
      let problem = placementProblem(currentTool, hoverTile.x, hoverTile.y);
      if (currentTool === "underground" && pendingUnderground) {
        const dir = DIRS[pendingUnderground.dir];
        const dx = hoverTile.x - pendingUnderground.x;
        const dy = hoverTile.y - pendingUnderground.y;
        const distance = dx * dir.x + dy * dir.y;
        const perpendicular = dx * dir.y - dy * dir.x;
        if (perpendicular !== 0 || distance < 2 || distance > 6) problem = "Saída fora da linha do túnel.";
      }
      const px = hoverTile.x * TILE;
      const py = hoverTile.y * TILE;
      ctx.save();
      ctx.globalAlpha = 0.68;
      ctx.fillStyle = problem ? "#b64f4a" : "#79dc91";
      ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.strokeStyle = problem ? "#ffd0cc" : "#eeffd9";
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = "#142019";
      ctx.font = "bold 9px ui-monospace, monospace";
      ctx.textAlign = "center";
      const text = tool.type === "belt" ? DIRS[buildDir].arrow
        : tool.type === "miner" ? "⛏"
        : tool.type === "furnace" ? "♨"
        : tool.type === "assembler" ? "◆"
        : tool.type === "splitter" ? "1→2"
        : tool.type === "underground" ? (pendingUnderground ? "OUT" : "IN")
        : tool.type === "merger" ? "2→1"
        : tool.type === "wall" ? "▥"
        : tool.type === "turret" ? "⌖"
        : tool.recipe === "ironPlate" ? "Fe" : "Cu";
      ctx.fillText(text, px + TILE / 2, py + TILE / 2 + 3);
      const ghostBuilding = { x: hoverTile.x, y: hoverTile.y, dir: buildDir, mirrored: buildMirrored };
      if (tool.type === "splitter") {
        drawTransportPorts(ghostBuilding, [(buildDir + 2) % 4], [buildDir, splitterSide(ghostBuilding)]);
      } else if (tool.type === "merger") {
        drawTransportPorts(ghostBuilding, mergerInputSides(ghostBuilding), [buildDir]);
      } else if (tool.type === "underground") {
        const tunnelDirection = pendingUnderground ? pendingUnderground.dir : buildDir;
        ghostBuilding.dir = tunnelDirection;
        drawTransportPorts(ghostBuilding, pendingUnderground ? [] : [(tunnelDirection + 2) % 4], pendingUnderground ? [tunnelDirection] : []);
      } else if (tool.type !== "belt" && tool.type !== "wall" && tool.type !== "turret") {
        drawMachinePorts({ x: hoverTile.x, y: hoverTile.y, dir: buildDir }, tool.type !== "miner");
      }
      ctx.restore();
    }

    function drawMapLabel(x, y, text, color) {
      ctx.fillStyle = "rgba(9,20,14,.72)";
      roundedRectPath(ctx, x * TILE - 24, y * TILE - 11, 48, 15, 4);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.font = "bold 8px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(text, x * TILE, y * TILE);
    }

    function render(renderDt) {
      updateCamera(renderDt);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#0e1b14";
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.save();
      ctx.translate(-Math.round(camera.x), -Math.round(camera.y));

      const minX = clamp(Math.floor(camera.x / TILE) - 1, 0, WORLD_W - 1);
      const minY = clamp(Math.floor(camera.y / TILE) - 1, 0, WORLD_H - 1);
      const maxX = clamp(Math.ceil((camera.x + viewW) / TILE) + 1, 0, WORLD_W - 1);
      const maxY = clamp(Math.ceil((camera.y + viewH) / TILE) + 1, 0, WORLD_H - 1);

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) drawTerrainTile(x, y, simClock);
      }

      drawMapLabel(16.5, 14.8, "FERRO", "#d4ddda");
      drawMapLabel(32.5, 17.8, "COBRE", "#f0a16a");
      drawEnemySpawns(simClock);
      drawHub(simClock);

      for (const building of state.buildings) {
        if (building.x >= minX - 1 && building.x <= maxX + 1 && building.y >= minY - 1 && building.y <= maxY + 1) {
          drawBuilding(building, simClock);
        }
      }
      for (const item of state.items) drawItem(item);
      for (const enemy of state.enemies) drawEnemy(enemy, simClock);
      drawGhost();
      drawPlayer(simClock);
      ctx.restore();
    }

    function formatNumber(value) {
      const number = Number(value) || 0;
      if (Math.abs(number) >= 1e9) return `${(number / 1e9).toFixed(2)}B`;
      if (Math.abs(number) >= 1e6) return `${(number / 1e6).toFixed(2)}M`;
      if (Math.abs(number) >= 1e3) return `${(number / 1e3).toFixed(1)}k`;
      if (Math.abs(number) >= 100) return Math.floor(number).toLocaleString("pt-BR");
      if (Math.abs(number) >= 10) return number.toFixed(1).replace(".0", "");
      return number.toFixed(1).replace(".0", "").replace(".", ",");
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.floor(seconds));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours) return `${hours}h ${minutes}min`;
      if (minutes) return `${minutes}min ${secs}s`;
      return `${secs}s`;
    }

    function updateToolPageButtons() {
      const tools = [...document.querySelectorAll(".tool")];
      const pageCount = Math.max(1, Math.ceil(tools.length / TOOL_PAGE_SIZE));
      toolPageIndex = clamp(toolPageIndex, 0, pageCount - 1);
      toolPrevBtn.disabled = toolPageIndex === 0;
      toolNextBtn.disabled = toolPageIndex >= pageCount - 1;
      toolPrevBtn.setAttribute("aria-label", `Ferramentas anteriores, página ${toolPageIndex + 1} de ${pageCount}`);
      toolNextBtn.setAttribute("aria-label", `Mais ferramentas, página ${toolPageIndex + 1} de ${pageCount}`);
    }

    function setToolPage(page) {
      const tools = [...document.querySelectorAll(".tool")];
      const pageCount = Math.max(1, Math.ceil(tools.length / TOOL_PAGE_SIZE));
      toolPageIndex = clamp(Math.round(page), 0, pageCount - 1);
      const target = tools[toolPageIndex * TOOL_PAGE_SIZE];
      const first = tools[0];
      if (target && first) {
        buildBarElement.scrollLeft = (Number(target.offsetLeft) || 0) - (Number(first.offsetLeft) || 0);
      }
      updateToolPageButtons();
    }

    function syncToolPageFromScroll() {
      const tools = [...document.querySelectorAll(".tool")];
      if (!tools.length) return;
      const firstOffset = Number(tools[0].offsetLeft) || 0;
      let nearestIndex = 0;
      let nearestDistance = Infinity;
      for (let index = 0; index < tools.length; index++) {
        const distance = Math.abs(((Number(tools[index].offsetLeft) || 0) - firstOffset) - buildBarElement.scrollLeft);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }
      }
      toolPageIndex = Math.floor(nearestIndex / TOOL_PAGE_SIZE);
      updateToolPageButtons();
    }

        return `<span style="color:var(--output)">MOVE ${DIRS[building.dir].arrow}</span>: transporta um item para o próximo tile`;

        return `<span style="color:var(--input)">ENTRA: lado ${DIRS[input].label}</span><br><span style="color:var(--output)">SAI: ${DIRS[building.dir].arrow} ${DIRS[building.dir].label} / ${DIRS[side].arrow} ${DIRS[side].label}</span>, alternando 1 por 1<br><strong>Lado auxiliar:</strong> ${DIRS[side].label} • F inverte`;
      }
      if (building.type === "merger") {
        const [back, side] = mergerInputSides(building);
        return `<span style="color:var(--input)">ENTRA: lados ${DIRS[back].label} + ${DIRS[side].label}</span><br><span style="color:var(--output)">SAI ${DIRS[building.dir].arrow}: ${DIRS[building.dir].label}</span><br><strong>Entrada auxiliar:</strong> ${DIRS[side].label} • F inverte`;
      }
      if (building.type === "underground") {
        const pair = undergroundPair(building);
        const distance = pair ? undergroundDistance(building) : 0;
        if (building.role === "entrance") {
          return `<span style="color:var(--input)">IN: recebe pelo lado ${DIRS[(building.dir + 2) % 4].label}</span><br><span style="color:var(--output)">SUBTERRÂNEO:</span> ${pair ? `${distance} tiles até OUT` : "par desconectado"}`;
        }

        const kind = getDeposit(building.x, building.y);
        return `<span style="color:var(--output)">SAI ${DIRS[building.dir].arrow}</span>: ${kind ? ITEMS[kind].label : "recurso da jazida"}`;

      if (building.type === "wall") {
        return `<span style="color:var(--output)">BLOQUEIO:</span> força os inimigos a contornar ou destruir esta parede`;

    function currentObjective(network) {
      const miners = state.buildings.filter(b => b.type === "miner");
      const furnaces = state.buildings.filter(b => b.type === "furnace");
      const wireAssemblers = state.buildings.filter(b => b.type === "assembler" && b.recipe === "copperWire");
      const circuitAssemblers = state.buildings.filter(b => b.type === "assembler" && b.recipe === "circuit");
      const ammoAssemblers = state.buildings.filter(b => b.type === "assembler" && b.recipe === "ammo");
      const walls = state.buildings.filter(b => b.type === "wall");
      const turrets = state.buildings.filter(b => b.type === "turret");
      const anyRate = network.creditsPerSecond > 0.0001;
      const researchedCount = Object.keys(TECHS).filter(key => hasTech(key)).length;
      const firstTechCost = Math.min(...Object.values(TECHS).filter(tech => tech.requires.length === 0).map(tech => tech.cost));

      if (!miners.length) {
        return "Pressione <strong>B</strong>, escolha <strong>Minerador</strong> e coloque-o na jazida cinza a oeste. Gire a saída para o Hub.";
      }
      if (!anyRate) {
        return "Conecte a seta de saída de um minerador ao <strong>Hub</strong> usando esteiras. Cada seta define o próximo tile.";
      }
      if (state.economy.researchPoints >= firstTechCost && researchedCount === 0) {
        return `Você tem <strong>${formatNumber(state.economy.researchPoints)} Pesquisa</strong>. Abra <strong>TEC</strong> e escolha sua primeira tecnologia permanente.`;
      }
      if (state.economy.tier === 1) {
        return `Venda minério até o Tier 2: <strong>${formatNumber(state.economy.runEarned)} / ${TIER_THRESHOLDS[2]} Cr</strong> ganhos nesta rodada.`;
      }
      if (!furnaces.length) {
        return "Tier 2: construa <strong>Fornalhas</strong> e escolha a receita de Placa de Ferro ou Placa de Cobre.";
      }
      if (!ammoAssemblers.length) {
        return `Wave ${state.combat.wave} em <strong>${Math.ceil(state.combat.timer)} s</strong>: configure uma Montadora para <strong>Munição</strong> e alimente-a com Placas de Ferro.`;
      }
      if (!walls.length || !turrets.length) {
        return `Prepare a defesa: construa <strong>Paredes (8)</strong> para canalizar inimigos e <strong>Torretas (9)</strong> próximas ao Hub.`;
      }
      if (state.inventory.ammo < 4) {
        return `<strong>Estoque de munição baixo:</strong> ${formatNumber(state.inventory.ammo)}. Cada Placa de Ferro produz 4 munições na Montadora.`;
      }
      if (!wireAssemblers.length) {
        return "Leve <strong>Placa de Cobre</strong> até uma Montadora configurada para produzir <strong>Fio de Cobre</strong>.";
      }
      if (state.economy.tier === 2) {
        return `Processe materiais até o Tier 3: <strong>${formatNumber(state.economy.runEarned)} / ${TIER_THRESHOLDS[3]} Cr</strong> ganhos.`;
      }
      if (!circuitAssemblers.length) {
        return "Tier 3: configure outra Montadora para <strong>Circuito</strong> e envie Placa de Ferro + Fio de Cobre pelos lados azuis.";
      }
      if (!prestigeAvailable()) {
        return `Entregue circuitos para prestigiar: <strong>${Math.floor(state.inventory.circuit)} / ${PRESTIGE_CIRCUITS}</strong>.`;
      }
      return `Prestígio disponível no menu. Cada Núcleo concede <strong>+${Math.round(prestigeSpeedPerLevel() * 100)}% de velocidade permanente</strong>.`;
    }

    function updateUI(forceRate = false) {
      if (!state) return;
      const network = getNetworkRates(forceRate);
      creditsText.textContent = formatNumber(state.economy.credits);
      tierText.textContent = String(state.economy.tier);
      rateText.textContent = `${formatNumber(network.creditsPerSecond * 60)} Cr/min`;
      coreText.textContent = `${state.economy.prestige} (+${Math.round(state.economy.prestige * prestigeSpeedPerLevel() * 100)}%)`;
      researchBadge.textContent = formatNumber(state.economy.researchPoints);
      researchBadge.title = `${formatNumber(state.economy.researchPoints)} pontos de Pesquisa`;
      objectiveText.innerHTML = currentObjective(network);
      const basePercent = Math.round(clamp(state.combat.baseHp / HUB_MAX_HP, 0, 1) * 100);
      waveText.textContent = state.combat.phase === "locked"
        ? "TIER 2"
        : state.combat.phase === "prep"
          ? `${state.combat.wave} EM ${Math.ceil(state.combat.timer)}s`
          : `${state.combat.wave} • ${state.enemies.length + state.combat.spawnRemaining} RESTAM`;
      baseText.textContent = `${basePercent}%`;
      ammoText.textContent = formatNumber(state.inventory.ammo);
      defenseBtn.classList.toggle("active-wave", state.combat.phase === "active");
      defenseBtn.classList.toggle("base-critical", basePercent <= 30);

      const selected = buildingById.get(selectedBuildingId);
      document.body.classList.toggle("has-selection", Boolean(selected));
      document.body.classList.toggle("building-mode", Boolean(currentTool));
      document.body.classList.toggle("desktop-build-open", !mobileLayout && desktopBuildOpen);
      buildModeBtn.classList.toggle("active", !mobileLayout && desktopBuildOpen);
      buildModeBtn.setAttribute("aria-pressed", !mobileLayout && desktopBuildOpen ? "true" : "false");
      buildModeBtn.setAttribute("aria-label", desktopBuildOpen ? "Fechar modo de construção, tecla B" : "Abrir modo de construção, tecla B");
      syncBuildDrawerUI();
      if (selected) {
        selectionInfo.hidden = false;
        selectionText.innerHTML = `<strong>${buildingLabel(selected)}</strong><br>${describeSelection(selected)}`;
      } else {
        selectionInfo.hidden = true;
        selectionText.textContent = "";
      }

      for (const button of document.querySelectorAll(".tool")) {
        const key = button.dataset.tool;
        const tool = TOOLS[key];
        const locked = state.economy.tier < tool.tier;
        button.classList.toggle("locked", locked);
        button.classList.toggle("selected", currentTool === key);
        button.disabled = locked;
        button.style.opacity = !locked && state.economy.credits < tool.cost ? ".66" : "";
        button.setAttribute("aria-pressed", currentTool === key ? "true" : "false");
      }

      const direction = currentTool ? buildDir : selected ? selected.dir : buildDir;
      rotateLabel.textContent = DIRS[direction].label;
      const directionlessTool = currentTool && (TOOLS[currentTool].type === "wall" || TOOLS[currentTool].type === "turret");
      rotateBtn.disabled = Boolean(directionlessTool || (selected && (selected.type === "underground" || selected.type === "wall" || selected.type === "turret") && !currentTool));
      const invertTarget = currentTool
        ? { type: TOOLS[currentTool].type, dir: buildDir, mirrored: buildMirrored }
        : selected;
      const canInvert = canInvertTransport(invertTarget);
      document.body.classList.toggle("can-invert", canInvert);
      invertBtn.disabled = !canInvert;
      if (canInvert) {
        const side = modifierAuxiliarySide(invertTarget);
        invertLabel.textContent = "Inverter";
        invertBtn.title = `${invertTarget.type === "splitter" ? "Saída" : "Entrada"} auxiliar atual: ${DIRS[side].label} • tecla F`;
        invertBtn.setAttribute("aria-label", `${invertTarget.type === "splitter" ? "Inverter saída lateral" : "Inverter entrada lateral"}; lado atual ${DIRS[side].label}`);
      } else {
        invertLabel.textContent = "Inverter";
        invertBtn.title = "Disponível para Divisor e Combinador";
      }
      const canSelectRecipe = Boolean(!currentTool && isConfigurableMachine(selected));
      document.body.classList.toggle("can-select-recipe", canSelectRecipe);
      recipeBtn.disabled = !canSelectRecipe;
      recipeBtn.title = canSelectRecipe ? `Receita atual: ${RECIPES[selected.recipe]?.label || "nenhuma"} • tecla C` : "Selecione uma Fornalha ou Montadora";
      deleteBtn.disabled = !selected;
      upgradeBtn.disabled = !selected || selected.level >= MAX_BUILDING_LEVEL;
      if (!selected) {
        upgradeLabel.textContent = "Selecione para melhorar";
      } else if (selected.level >= MAX_BUILDING_LEVEL) {
        upgradeLabel.textContent = `Nível máximo (${MAX_BUILDING_LEVEL})`;
      } else {
        const cost = upgradeCost(selected);
        upgradeLabel.textContent = `Melhorar para Nv.${selected.level + 1} • ${formatNumber(cost)} Cr`;
        upgradeBtn.style.opacity = state.economy.credits < cost ? ".62" : "";
      }
      if (!selected || selected.level >= MAX_BUILDING_LEVEL) upgradeBtn.style.opacity = "";
      cancelLabel.textContent = pendingUnderground ? "Cancelar entrada IN" : currentTool ? "Cancelar construção" : selected ? "Limpar seleção" : "Sem seleção";
      cancelBtn.disabled = !currentTool && !selected;

      if (currentTool) {
        const rotates = TOOLS[currentTool].type !== "wall" && TOOLS[currentTool].type !== "turret";
        modeHint.innerHTML = `${toolFlowHTML(currentTool)}${rotates ? " • <strong>R</strong> gira" : ""} • <strong>botão direito</strong> remove • <strong>B</strong> fecha`;
      } else if (selected) {
        modeHint.innerHTML = `${machineFlowHTML(selected)}${isConfigurableMachine(selected) ? " • <strong>C</strong> receitas" : ""} • <strong>U</strong> melhora • <strong>Del</strong> remove${desktopBuildOpen && !mobileLayout ? " • <strong>botão direito</strong> remove sob o cursor" : ""}`;
      } else if (mobileLayout && buildDrawerOpen) {
        modeHint.textContent = "Escolha uma peça • a barra fecha ao selecionar • use MAIS/VOLTAR para trocar a página";
      } else if (!mobileLayout && desktopBuildOpen) {
        modeHint.innerHTML = `<strong>MODO BUILD</strong> • 1–9 escolhe a peça • botão direito remove • B fecha`;
      } else {
        modeHint.textContent = "WASD/setas: andar • B: modo BUILD • T: tecnologias • M: menu • clique: selecionar";
      }
      updateToolPageButtons();
    }

    function closeModal() {
      modalOverlay.hidden = true;
      modalOverlay.classList.remove("tech-open");
      modalActions.replaceChildren();
    }

    function openModal(title, bodyHTML, actions) {
      heldMoveDir = null;
      for (const key of document.querySelectorAll(".dkey")) key.classList.remove("pressed");
      modalOverlay.classList.remove("tech-open");
      modalTitle.textContent = title;
      modalBody.innerHTML = bodyHTML;
      modalActions.replaceChildren();
      for (const action of actions) {
        const button = document.createElement("button");
        button.className = `modal-action ${action.kind || ""}`.trim();
        button.textContent = action.label;
        button.disabled = Boolean(action.disabled);
        button.addEventListener("click", () => {
          closeModal();
          if (action.onClick) window.setTimeout(action.onClick, 0);
        });
        modalActions.appendChild(button);
      }
      modalOverlay.hidden = false;
    }

    function techNodeStatus(key) {
      if (hasTech(key)) return "unlocked";
      return techPrerequisitesMet(key) ? "available" : "blocked";
    }

    function techConnectorPath(sourceKey, targetKey) {
      const source = TECH_LAYOUT[sourceKey];
      const target = TECH_LAYOUT[targetKey];
      const startX = source.x + TECH_NODE_W;
      const startY = source.y + TECH_NODE_H / 2;
      const endX = target.x;
      const endY = target.y + TECH_NODE_H / 2;
      const bend = Math.max(64, (endX - startX) * 0.5);
      return `M ${startX} ${startY} C ${startX + bend} ${startY}, ${endX - bend} ${endY}, ${endX} ${endY}`;
    }

    function centerTechNode(key) {
      const viewport = modalBody.querySelector(".tech-viewport");
      const node = modalBody.querySelector(`.tech-map-node[data-tech="${key}"]`);
      if (!viewport || !node) return;
      viewport.scrollLeft = Math.max(0, node.offsetLeft + node.offsetWidth / 2 - viewport.clientWidth / 2);
      viewport.scrollTop = Math.max(0, node.offsetTop + node.offsetHeight / 2 - viewport.clientHeight / 2);
    }

    function renderTechDetails(key) {
      const panel = modalBody.querySelector("#techDetails");
      const tech = TECHS[key];
      const layout = TECH_LAYOUT[key];
      if (!panel || !tech || !layout) return;

      const status = techNodeStatus(key);
      const missing = tech.requires.filter(requirement => !hasTech(requirement));
      const requirementLines = tech.requires.length
        ? tech.requires.map(requirement => `${hasTech(requirement) ? "✓" : "○"} ${TECHS[requirement].label}`).join("<br>")
        : "✓ Tecnologia inicial";
      const remaining = Math.max(0, tech.cost - state.economy.researchPoints);

      let statusHTML;
      if (status === "unlocked") {
        statusHTML = `<div class="tech-detail-status good"><strong>ATIVA PERMANENTEMENTE</strong><br>Continua ativa depois do prestígio.</div>`;
      } else if (status === "blocked") {
        statusHTML = `<div class="tech-detail-status"><strong>BLOQUEADA</strong><br>Pesquise antes: ${missing.map(requirement => TECHS[requirement].label).join(" + ")}.</div>`;
      } else if (remaining > 0) {
        statusHTML = `<div class="tech-detail-status ready"><strong>CAMINHO LIBERADO</strong><br>Faltam ${formatNumber(remaining)} pontos de Pesquisa.</div>`;
      } else {
        statusHTML = `<div class="tech-detail-status ready"><strong>PRONTA PARA PESQUISAR</strong><br>O efeito é aplicado imediatamente.</div>`;
      }

      const buttonLabel = status === "unlocked" ? "PESQUISADA" : status === "blocked" ? "PRÉ-REQUISITOS PENDENTES" : `PESQUISAR • ${tech.cost} ⚗`;
      panel.innerHTML = `
        <span class="tech-detail-kicker">${layout.branch} • nó selecionado</span>
        <h3>${layout.icon} ${tech.label}</h3>
        <p><strong>Efeito:</strong> ${tech.description}</p>
        <div class="tech-detail-status"><strong>Dependências</strong><br>${requirementLines}</div>
        ${statusHTML}
        <button class="tech-buy" data-tech-buy="${key}" ${status === "blocked" || status === "unlocked" ? "disabled" : ""}>${buttonLabel}</button>`;

      const buyButton = panel.querySelector("[data-tech-buy]");
      if (buyButton) buyButton.addEventListener("click", () => buyTech(key));
    }

    function selectTechNode(key, center = false) {
      if (!TECHS[key]) return;
      selectedTechKey = key;
      for (const node of modalBody.querySelectorAll(".tech-map-node[data-tech]")) {
        const selected = node.dataset.tech === key;
        node.classList.toggle("selected", selected);
        node.setAttribute("aria-pressed", selected ? "true" : "false");
      }
      renderTechDetails(key);
      if (center) centerTechNode(key);
    }

    function enableTechMapPan() {
      const viewport = modalBody.querySelector(".tech-viewport");
      if (!viewport) return;
      let pan = null;

      viewport.addEventListener("pointerdown", event => {
        if (event.target.closest(".tech-map-node")) return;
        pan = {
          pointerId: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          left: viewport.scrollLeft,
          top: viewport.scrollTop
        };
        viewport.classList.add("dragging");
        try { viewport.setPointerCapture(event.pointerId); } catch (_) {}
        event.preventDefault();
      });

      viewport.addEventListener("pointermove", event => {
        if (!pan || pan.pointerId !== event.pointerId) return;
        viewport.scrollLeft = pan.left - (event.clientX - pan.x);
        viewport.scrollTop = pan.top - (event.clientY - pan.y);
        event.preventDefault();
      });

      const stopPan = event => {
        if (!pan || pan.pointerId !== event.pointerId) return;
        pan = null;
        viewport.classList.remove("dragging");
        try { viewport.releasePointerCapture(event.pointerId); } catch (_) {}
      };
      viewport.addEventListener("pointerup", stopPan);
      viewport.addEventListener("pointercancel", stopPan);
      viewport.addEventListener("lostpointercapture", () => {
        pan = null;
        viewport.classList.remove("dragging");
      });
    }

    function showTechTree() {
      const techKeys = Object.keys(TECHS);
      if (!selectedTechKey || !TECHS[selectedTechKey]) {
        selectedTechKey = techKeys.find(key => techNodeStatus(key) === "available") || techKeys[0];
      }

      const links = techKeys.flatMap(targetKey => TECHS[targetKey].requires.map(sourceKey => {
        const targetUnlocked = hasTech(targetKey);
        const linkClass = targetUnlocked ? "unlocked" : hasTech(sourceKey) ? "available" : "blocked";
        const path = techConnectorPath(sourceKey, targetKey);
        return `<path class="tech-link-shadow" d="${path}"></path><path class="tech-link ${linkClass}" d="${path}"></path>`;
      })).join("");

      const nodes = techKeys.map(key => {
        const tech = TECHS[key];
        const layout = TECH_LAYOUT[key];
        const status = techNodeStatus(key);
        const stateLabel = status === "unlocked" ? "ATIVA" : status === "available" ? `${tech.cost} ⚗` : "BLOQUEADA";
        return `<button class="tech-map-node ${status} ${key === selectedTechKey ? "selected" : ""}" data-tech="${key}" style="--node-x:${layout.x}px;--node-y:${layout.y}px" aria-pressed="${key === selectedTechKey ? "true" : "false"}" aria-label="${tech.label}: ${stateLabel}">
          <span class="tech-node-icon">${layout.icon}</span>
          <span class="tech-node-copy"><strong>${tech.label}</strong><small>${layout.branch}</small><span class="tech-node-state">${stateLabel}</span></span>
        </button>`;
      }).join("");

      openModal(
        "Rede de tecnologias",
        `<div class="tech-summary">
           <div class="tech-points"><span>Pesquisa</span><strong>⚗ ${formatNumber(state.economy.researchPoints)}</strong></div>
           <div class="tech-source"><strong>Como gerar:</strong> entregue materiais processados, munição ou circuitos. Minério bruto não gera Pesquisa.<br><strong>Rede expandida:</strong> ${Object.keys(TECHS).length} nós permanentes; arraste o mapa e use a roda do mouse para explorar.</div>
         </div>
         <div class="tech-workbench">
           <div class="tech-viewport" role="region" aria-label="Mapa da rede de tecnologias">
             <div class="tech-map">
               <div class="tech-lane extraction"><span>EXTRAÇÃO</span></div>
               <div class="tech-lane processing"><span>PROCESSAMENTO E BALÍSTICA</span></div>
               <div class="tech-lane assembly"><span>MONTAGEM, ARMAZENAMENTO E FORTIFICAÇÃO</span></div>
               <div class="tech-lane logistics"><span>LOGÍSTICA</span></div>
               <div class="tech-lane automation"><span>AUTOMAÇÃO, PESQUISA E MERCADO</span></div>
               <div class="tech-lane core"><span>NÚCLEO, ENGENHARIA E PRESTÍGIO</span></div>
               <svg class="tech-links" viewBox="0 0 2100 1240" aria-hidden="true">${links}</svg>
               ${nodes}
             </div>
           </div>
           <aside id="techDetails" class="tech-details" aria-live="polite"></aside>
         </div>
         <div class="tech-legend"><span>Bloqueada</span><span class="ready">Disponível</span><span class="done">Pesquisada</span><strong>Permanentes após o prestígio</strong></div>`,
        [{ label: "Fechar árvore", kind: "primary" }]
      );

      modalOverlay.classList.add("tech-open");
      for (const node of modalBody.querySelectorAll(".tech-map-node[data-tech]")) {
        node.addEventListener("click", () => selectTechNode(node.dataset.tech, false));
      }
      enableTechMapPan();
      renderTechDetails(selectedTechKey);
      window.requestAnimationFrame(() => centerTechNode(selectedTechKey));
    }

    function machineStoredUnits(building) {
      const buffered = Object.values(building?.buffer || {}).reduce((total, amount) => total + Math.max(0, Number(amount) || 0), 0);
      return buffered + Math.max(0, Number(building?.outputCount) || 0) + (Number(building?.progress) > 0.001 ? 1 : 0);
    }

    function applyMachineRecipe(buildingId, recipeKey) {
      const building = buildingById.get(String(buildingId));
      const recipe = RECIPES[recipeKey];
      if (!isConfigurableMachine(building) || !recipe || recipe.machine !== building.type) return false;
      if (state.economy.tier < recipe.tier) {
        showToast(`A receita ${recipe.label} requer Tier ${recipe.tier}.`);
        return false;
      }
      if (building.recipe === recipeKey) return true;
      building.recipe = recipeKey;
      building.buffer = {};
      building.progress = 0;
      building.outputCount = 0;
      cachedNetwork = null;
      updateUI(true);
      saveGame(false);
      showToast(`${building.type === "furnace" ? "Fornalha" : "Montadora"} configurada para ${recipe.label}.`);
      return true;
    }

    function requestMachineRecipe(buildingId, recipeKey) {
      const building = buildingById.get(String(buildingId));
      const recipe = RECIPES[recipeKey];
      if (!building || !recipe || building.recipe === recipeKey) return;
      if (state.economy.tier < recipe.tier) {
        showToast(`A receita ${recipe.label} requer Tier ${recipe.tier}.`);
        return;
      }
      if (machineStoredUnits(building) > 0) {
        openModal(
          "Trocar receita e esvaziar?",
          `<div class="box"><strong>${buildingLabel(building)}</strong><br>A troca para <strong>${recipe.label}</strong> descarta os itens e o progresso que ainda estão dentro desta máquina.</div>`,
          [
            { label: "Voltar", onClick: () => showMachineRecipes(building.id) },
            { label: "Esvaziar e trocar", kind: "danger", onClick: () => {
              applyMachineRecipe(building.id, recipeKey);
              showMachineRecipes(building.id);
            } }
          ]
        );
        return;
      }
      applyMachineRecipe(building.id, recipeKey);
      showMachineRecipes(building.id);
    }

    function showMachineRecipes(buildingId) {
      const building = buildingById.get(String(buildingId));
      if (!isConfigurableMachine(building)) {
        showToast("Selecione uma Fornalha ou Montadora.");
        return;
      }
      const recipes = Object.entries(RECIPES).filter(([, recipe]) => recipe.machine === building.type);
      const cards = recipes.map(([key, recipe]) => {
        const active = building.recipe === key;
        const locked = state.economy.tier < recipe.tier;
        const input = Object.entries(recipe.inputs).map(([kind, amount]) => `${amount}× ${ITEMS[kind].label}`).join(" + ");
        const outputAmount = Math.max(1, Number(recipe.outputAmount) || 1);
        const output = `${outputAmount > 1 ? `${outputAmount}× ` : ""}${ITEMS[recipe.output].label}`;
        const buttonLabel = active ? "RECEITA ATIVA" : locked ? `REQUER TIER ${recipe.tier}` : "SELECIONAR RECEITA";
        return `<article class="recipe-card ${active ? "active" : ""} ${locked ? "locked" : ""}">
          <strong>${recipe.icon} ${recipe.label}</strong>
          <div class="recipe-flow"><span>${input}</span><b>→</b><span>${output}</span></div>
          <small>Tempo base: ${String(recipe.duration).replace(".", ",")} s • Tier ${recipe.tier}</small>
          <button class="recipe-select" data-recipe-key="${key}" ${active || locked ? "disabled" : ""}>${buttonLabel}</button>
        </article>`;
      }).join("");
      const machineName = building.type === "furnace" ? "Fornalha" : "Montadora";
      const machineIcon = building.type === "furnace" ? "♨" : "◆";
      openModal(
        `Receitas da ${machineName}`,
        `<div class="recipe-machine-summary">
           <div class="recipe-machine-icon">${machineIcon}</div>
           <p><strong>Receita atual:</strong> ${RECIPES[building.recipe]?.label || "nenhuma"}<br>Entradas pelas portas azuis; resultado pela porta amarela.<br><span class="bad">Trocar uma máquina ocupada esvazia seu conteúdo.</span></p>
         </div>
         <div class="recipe-grid">${cards}</div>`,
        [{ label: "Fechar receitas", kind: "primary" }]
      );
      for (const button of modalBody.querySelectorAll("[data-recipe-key]")) {
        button.addEventListener("click", () => requestMachineRecipe(building.id, button.dataset.recipeKey));
      }
    }
